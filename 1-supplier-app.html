act.closeMonth=()=>{
  const p=payrollFor(ui.month,true);if(p.closed)return;
  p.rows=p.rows.filter(rowData);
  if(!p.rows.length){alert('أضف موظفًا واحدًا على الأقل قبل التقفيل.');renderPayroll();return;}
  const blockers=[],warns=[];
  p.rows.forEach((r,i)=>{
    const c=calcRow(r,p),name=(r.name||'').trim();
    if(!name){blockers.push('الصف رقم '+(i+1)+': توجد أرقام بدون اسم موظف');return;}
    if(c.att&&c.st.missing)warns.push(name+': '+c.st.missing+' يوم لم يُسجَّل فيه حضور أو غياب');
    if(!c.hours&&!c.units)warns.push(name+': لا توجد ساعات أو أيام محتسبة');
    if(!c.rate)warns.push(name+': قيمة الأجر صفر');
    if(c.net<0)warns.push(name+': السلف أكبر من المستحق (الصافي '+fmt(c.net)+')');
  });
  if(blockers.length){alert(blockers.join('\n'));renderPayroll();return;}
  const t=payrollTotals(p),grp=payGroups(p);
  const ids=Object.keys(grp);
  for(const a of ids){if(a&&!okBalance(a,-grp[a])){renderPayroll();return;}}
  const dest=ids.length?ids.map(a=>(a?(getAcc(a)?getAcc(a).name:'حساب محذوف'):'نقدًا')+' ('+fmt(grp[a])+' '+CUR+')').join('، '):'لا يوجد صافٍ للدفع';
  const msg=(warns.length?'تنبيهات:\n- '+warns.join('\n- ')+'\n\n':'')+
    'سيتم تقفيل شهر '+monthLabel(ui.month)+'\nإجمالي الصافي: '+fmt(t.net)+' '+CUR+'\nجهة الصرف: '+dest+'\n\nبعد التقفيل تُقفل الأرقام. هل تريد المتابعة؟';
  if(!confirm(msg)){renderPayroll();return;}
  p.rows.forEach(r=>{
    if(!isAtt(r))return;
    const c=calcRow(r,p);
    r.payAcc=rowPayAcc(r,p);
    r.rate=String(c.rate);r.hpd=String(c.hpd);r.pb=c.basis;
  });
  p.snap={};p.rows.forEach(r=>{if(isAtt(r))p.snap[r.id]=JSON.parse(JSON.stringify(calcRow(r,p)));});
  p.closed=true;p.closedAt=todayStr();
  calcReset();
  save();renderPayroll();toast('تم تقفيل شهر '+monthLabel(ui.month));
};
act.reopenMonth=()=>{
  const p=payrollFor(ui.month,false);if(!p||!p.closed)return;
  if(!confirm('ستؤدي إعادة فتح الشهر إلى رد المبلغ المخصوم (إن كان من حساب) والسماح بالتعديل. هل تريد المتابعة؟'))return;
  p.closed=false;p.closedAt=null;delete p.snap;
  p.rows.forEach(r=>{
    delete r.payAcc;
  });
  calcReset();save();renderPayroll();toast('تمت إعادة فتح الشهر');
};

const COMM_FORMS={txn:1,transfer:1,expense:1,revenue:1,voucher:1,doc:1};
function commCtx(f){
  const t=f.dataset.form,g=n=>f.elements[n];
  let acc,dir,key;
  if(t==='transfer'){acc=g('from')?g('from').value:'';dir='tr';key='tr';}
  else{
    acc=g('acc')?g('acc').value:'';
    dir=t==='expense'?'out':(t==='revenue'?'in':(t==='voucher'?(f.dataset.kind==='c'?'in':'out'):(t==='doc'?(f.dataset.dk==='s'?'in':'out'):(g('kind')?g('kind').value:'in'))));
    key=dir==='out'?'out':((g('ch')&&g('ch').value==='mer')?'mer':'in');
  }
  return {acc:acc,dir:dir,key:key,a:getAcc(acc)};
}
function commByOptions(ctx){
  if(ctx.dir==='in')return [['other','العميل'],['shop','المحل']];
  if(ctx.dir==='tr')return [['shop','المحل'],['other','جهة أخرى (للعلم فقط)']];
  return [['shop','المحل'],['other','المستلم (للعلم فقط)']];
}
const commDefaultBy=ctx=>(ctx.dir==='in'&&ctx.key!=='mer')?'other':'shop';
function commSync(f,src){
  const box=f.querySelector('.cm-box');if(!box)return;
  const ctx=commCtx(f),g=n=>f.elements[n],t=f.dataset.form;
  box.hidden=!ctx.a;
  if(!ctx.a){g('cm_p').value='';g('cm_a').value='';return;}
  const chSel=g('ch');
  if(chSel){const lab=chSel.closest('label');lab.hidden=ctx.dir!=='in';if(ctx.dir!=='in')chSel.value='';}
  const bySel=g('cm_by'),amount=cn(g('amount').value),rate=commRate(ctx.a,ctx.key);
  const fresh=src==='acc'||src==='kind'||src==='ch'||(src==='init'&&!box.dataset.src);
  if(fresh||src==='init'||!bySel.options.length){
    const cur=bySel.value,opts=commByOptions(ctx);
    bySel.innerHTML=opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('');
    bySel.value=(box.dataset.touched==='1'&&(cur||box.dataset.by))?(cur||box.dataset.by):commDefaultBy(ctx);
  }
  const pEl=g('cm_p'),aEl=g('cm_a');
  if(fresh){pEl.value=rate.p?String(rate.p):'';box.dataset.src='p';if(rate.p)box.open=true;}
  if(src==='p')box.dataset.src='p';
  if(src==='a')box.dataset.src='a';
  if(src!=='by'&&src!=='on'&&!(src==='init'&&box.dataset.src==='a')){
    if(box.dataset.src==='a'){
      const av=cn(aEl.value);
      pEl.value=(av&&amount)?String(Math.round(av/amount*1000000)/10000):'';
    }else{
      const pv=cn(pEl.value),av=commCalc(rate,amount,pv,Math.abs(pv-rate.p)<1e-9);
      aEl.value=av?String(av):'';
    }
  }
  const av=cn(aEl.value),by=bySel.value;
  let msg='اترك الخانتين فارغتين إن لم تكن هناك عمولة.';
  if(av){
    if(amount>0&&av>amount)msg='⚠ لا يمكن أن تزيد العمولة عن المبلغ.';
    else if(by==='shop'){
      const on=(t==='transfer'&&g('cm_on')&&g('cm_on').value==='to')?getAcc(g('to').value):ctx.a;
      msg='تُسجَّل العمولة ('+fmt(av)+' '+CUR+') على المحل وتُخصم من رصيد «'+(on?on.name:'')+'» وتدخل في تكاليف الشهر.';
    }else msg='العمولة ('+fmt(av)+' '+CUR+') على '+(ctx.dir==='in'?'العميل':'الطرف الآخر')+' وتُسجَّل للعلم فقط دون أثر على الأرصدة.';
  }
  const note=$('.cm-note',box);if(note)note.textContent=msg;
}
function commInit(el){$$('form[data-form] .cm-box',el).forEach(b=>commSync(b.closest('form'),'init'));}
const COMM_SRC={amount:'amount',cm_p:'p',cm_a:'a',cm_by:'by',cm_on:'on',acc:'acc',from:'acc',to:'on',kind:'kind',ch:'ch'};
function commEvent(t){
  const f=t.form;
  if(!f||!f.dataset||!COMM_FORMS[f.dataset.form]||!t.name||!COMM_SRC[t.name])return;
  const box=f.querySelector('.cm-box');if(!box)return;
  if(t.name==='cm_by')box.dataset.touched='1';
  commSync(f,COMM_SRC[t.name]);
}

function readComm(f,amount){
  const box=f.querySelector('.cm-box');
  if(!box||box.hidden)return {c:null};
  const d=new FormData(f),ctx=commCtx(f);
  const rate=commRate(ctx.a,ctx.key);
  let a=round2(parseNum(d.get('cm_a')));
  if(!(a>0)){const pv=cn(d.get('cm_p'));a=commCalc(rate,amount,pv,Math.abs(pv-rate.p)<1e-9);}
  if(!(a>0))return {c:null};
  if(a>amount)return {err:'لا يمكن أن تزيد العمولة عن المبلغ'};
  const c={a:a,by:d.get('cm_by')==='other'?'other':'shop'};
  if(ctx.dir==='in'&&d.get('ch')==='mer')c.ch='mer';
  if(ctx.dir==='tr'&&d.get('cm_on')==='to')c.on='to';
  return {c:cleanEntryComm(c,amount,{inc:ctx.dir==='in',tr:ctx.dir==='tr'})};
}
act.editFees=b=>{
  const a=getAcc(b.dataset.id);if(!a)return;
  const rows=Object.keys(COMM_KEYS).map(k=>{
    const r=(a.comm&&a.comm[k])||{},v=n=>r[n]?esc(String(r[n])):'';
    return '<div class="fee-row"><b>'+COMM_KEYS[k]+'</b><div class="fee-in">'+
      '<label class="fld"><span>النسبة ٪</span><input name="'+k+'_p" inputmode="decimal" maxlength="8" value="'+v('p')+'"></label>'+
      '<label class="fld"><span>أدنى ('+CUR+')</span><input name="'+k+'_min" inputmode="decimal" maxlength="10" value="'+v('min')+'"></label>'+
      '<label class="fld"><span>أقصى ('+CUR+')</span><input name="'+k+'_max" inputmode="decimal" maxlength="10" value="'+v('max')+'"></label></div></div>';
  }).join('');
  openModal({title:'رسوم وعمولات «'+a.name+'»',
    text:'تُستخدم هذه النسب افتراضيًا عند تسجيل الحركات، ويمكن تغييرها في كل حركة. اترك الخانة فارغة إن لم توجد عمولة. الحدان الأدنى والأقصى اختياريان (مثال: 1٪ بحد أدنى 1 وحد أقصى 15).',
    fields:[],extra:rows,okLabel:'حفظ',
    onSubmit:async v=>{
      const o={};
      for(const k of Object.keys(COMM_KEYS)){
        const raw={p:v[k+'_p'],min:v[k+'_min'],max:v[k+'_max']};
        for(const f of ['p','min','max']){
          const t=String(raw[f]==null?'':raw[f]).trim();
          if(t!==''&&!(parseNum(t)>=0&&/\d/.test(normDigits(t))))return 'أدخل أرقامًا صحيحة غير سالبة في «'+COMM_KEYS[k]+'»';
        }
        if(parseNum(raw.p)>100)return 'النسبة يجب أن تكون بين 0 و100 في «'+COMM_KEYS[k]+'»';
        if(parseNum(raw.max)>0&&parseNum(raw.min)>parseNum(raw.max))return 'الحد الأدنى يجب ألا يزيد عن الحد الأقصى في «'+COMM_KEYS[k]+'»';
        o[k]=raw;
      }
      const c=cleanComm(o);
      if(Object.keys(c).length)a.comm=c;else delete a.comm;
      save();render();toast('تم حفظ رسوم الحساب');return null;
    }});
};

forms.expense=f=>{
  const d=new FormData(f);
  const date=d.get('date'),cat=d.get('cat'),desc=(d.get('desc')||'').trim(),amount=round2(parseNum(d.get('amount'))),accId=d.get('acc')||'';
  if(!date){toast('اختر التاريخ');return;}
  if(!(amount>0)){toast('أدخل مبلغًا صحيحًا أكبر من صفر');return;}
  if(ownOnly('expenses')&&!addDateOk(date)){toast('يجب أن يكون التاريخ ضمن آخر 7 أيام حتى اليوم');return;}
  const old=ui.editExp?state.expenses.find(x=>x.id===ui.editExp):null;
  if(old&&!canTouch('expenses',old)){ui.editExp=null;renderExpenses();toast('لا يمكن تعديل هذا الإدخال');return;}
  const rc=accId?readComm(f,amount):{c:null};
  if(rc.err){toast(rc.err);return;}
  const delta=-(amount+(rc.c&&rc.c.by==='shop'?rc.c.a:0))+((old&&old.accountId===accId)?parseNum(old.amount)+shopComm(old):0);
  if(!okBalance(accId,delta))return;
  if(old){old.date=date;old.category=cat;old.desc=desc;old.amount=amount;old.accountId=accId;if(rc.c)old.comm=rc.c;else delete old.comm;}
  else{const ne={id:uid(),date:date,category:cat,desc:desc,amount:amount,accountId:accId,by:UID,at:Date.now()};if(rc.c)ne.comm=rc.c;state.expenses.push(ne);}
  ui.editExp=null;ui.lastExpDate=date;save();renderExpenses();
  toast((date.slice(0,7)!==ui.month&&ui.expView!=='all')?'تم التسجيل بتاريخ '+fmtDate(date)+' (شهر آخر)':'تم تسجيل المصروف');
};

forms.revenue=f=>{
  const d=new FormData(f);
  const date=d.get('date'),cat=d.get('cat'),customer=(d.get('customer')||'').trim(),desc=(d.get('desc')||'').trim(),amount=round2(parseNum(d.get('amount'))),accId=d.get('acc')||'';
  if(!date){toast('اختر التاريخ');return;}
  if(!(amount>0)){toast('أدخل مبلغًا صحيحًا أكبر من صفر');return;}
  if(ownOnly('revenues')&&!addDateOk(date)){toast('يجب أن يكون التاريخ ضمن آخر 7 أيام حتى اليوم');return;}
  const old=ui.editRev?state.revenues.find(x=>x.id===ui.editRev):null;
  if(old&&!canTouch('revenues',old)){ui.editRev=null;renderRevenues();toast('لا يمكن تعديل هذا الإدخال');return;}
  const rc=accId?readComm(f,amount):{c:null};
  if(rc.err){toast(rc.err);return;}
  if(old&&old.accountId){
    const oldNet=parseNum(old.amount)-shopComm(old),newNet=amount-(rc.c&&rc.c.by==='shop'?rc.c.a:0);
    const dl=(old.accountId===accId)?(newNet-oldNet):-oldNet;
    if(dl<0&&!okBalance(old.accountId,dl))return;
  }
  if(old){old.date=date;old.category=cat;old.customer=customer;old.desc=desc;old.amount=amount;old.accountId=accId;if(rc.c)old.comm=rc.c;else delete old.comm;}
  else{const nr={id:uid(),date:date,category:cat,customer:customer,desc:desc,amount:amount,accountId:accId,by:UID,at:Date.now()};if(rc.c)nr.comm=rc.c;state.revenues.push(nr);}
  ui.editRev=null;ui.lastRevDate=date;save();renderRevenues();
  toast((date.slice(0,7)!==ui.month&&ui.revView!=='all')?'تم التسجيل بتاريخ '+fmtDate(date)+' (شهر آخر)':'تم تسجيل الإيراد');
};

forms.txn=f=>{
  const d=new FormData(f);
  const acc=d.get('acc'),date=d.get('date'),kind=d.get('kind'),amount=round2(parseNum(d.get('amount'))),note=(d.get('note')||'').trim();
  if(!acc||!getAcc(acc)){toast('اختر الحساب');return;}
  if(!date){toast('اختر التاريخ');return;}
  if(!(amount>0)){toast('أدخل مبلغًا صحيحًا أكبر من صفر');return;}
  const old=ui.editTxn?state.txns.find(x=>x.id===ui.editTxn):null;
  const rc=readComm(f,amount);
  if(rc.err){toast(rc.err);return;}
  const newC=rc.c&&rc.c.by==='shop'?rc.c.a:0;
  const newEff=(kind==='in'?amount:-amount)-newC;
  const oldEff=(old&&old.accountId===acc)?((old.kind==='in'?parseNum(old.amount):-parseNum(old.amount))-shopComm(old)):0;
  if(!okBalance(acc,newEff-oldEff))return;
  if(old){old.accountId=acc;old.date=date;old.kind=kind;old.amount=amount;old.note=note;if(rc.c)old.comm=rc.c;else delete old.comm;}
  else{const nt={id:uid(),accountId:acc,date:date,kind:kind,amount:amount,note:note};if(rc.c)nt.comm=rc.c;state.txns.push(nt);}
  ui.editTxn=null;save();render();toast('تم تسجيل الحركة');
};

forms.transfer=f=>{
  const d=new FormData(f);
  const from=d.get('from'),to=d.get('to'),date=d.get('date'),amount=round2(parseNum(d.get('amount'))),note=(d.get('note')||'').trim();
  if(!from||!to||!getAcc(from)||!getAcc(to)){toast('اختر الحسابين');return;}
  if(from===to){toast('يجب أن يكون الحسابان مختلفين');return;}
  if(!date){toast('اختر التاريخ');return;}
  if(!(amount>0)){toast('أدخل مبلغًا صحيحًا أكبر من صفر');return;}
  const rc=readComm(f,amount);
  if(rc.err){toast(rc.err);return;}
  const cs=rc.c&&rc.c.by==='shop'?rc.c.a:0,onTo=!!(rc.c&&rc.c.on==='to');
  if(!okBalance(from,-amount-(onTo?0:cs)))return;
  if(onTo&&cs&&!okBalance(to,-cs))return;
  const ntr={id:uid(),fromId:from,toId:to,date:date,amount:amount,note:note};
  if(rc.c)ntr.comm=rc.c;
  state.transfers.push(ntr);
  save();render();toast('تم تحويل '+fmt(amount)+' '+CUR);
};
act.delTransfer=b=>{
  const t=state.transfers.find(x=>x.id===b.dataset.id);if(!t)return;
  if(!confirm('حذف هذا التحويل؟ (سيُزال من الحسابين) — '+accName(t.fromId)+' ← '+accName(t.toId)+' '+fmt(t.amount)+' '+CUR))return;
  state.transfers=state.transfers.filter(x=>x.id!==t.id);save();render();
};

$('#logoFile').addEventListener('change',ev=>{
  const f=ev.target.files[0];ev.target.value='';
  if(!f||!isAdm())return;
  if(!/^image\//.test(f.type)){toast('اختر ملف صورة');return;}
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,360/Math.max(img.width,img.height,1));
      const cvs=document.createElement('canvas');
      cvs.width=Math.max(1,Math.round(img.width*sc));cvs.height=Math.max(1,Math.round(img.height*sc));
      cvs.getContext('2d').drawImage(img,0,0,cvs.width,cvs.height);
      let url=cvs.toDataURL('image/png');
      if(url.length>350000)url=cvs.toDataURL('image/jpeg',0.82);
      state.settings.logo=url;save();render();toast('تم حفظ الشعار');
    };
    img.onerror=()=>toast('تعذّرت قراءة الصورة');
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
});

const PERM_PRESETS=[
  ['','اختر قالبًا جاهزًا (اختياري)'],
  ['entry','مُدخِل بيانات: إدخال الإيرادات والمصروفات فقط'],
  ['viewer','مشاهِد: عرض فقط لكل الأقسام'],
  ['acct','محاسب: كل الأقسام بصلاحية كاملة'],
  ['marine','العمليات البحرية: الإبلاغ عن الأعطال وتعليم بنود المراجعة'],
  ['maint','مسؤول الصيانة: صلاحية كاملة على الصيانة وإدخال في قوائم المراجعة'],
  ['none','إلغاء كل الصلاحيات']
];
function presetPerms(k){
  const o={};
  allModIds().forEach(id=>{
    const lv=modLevels(id),ops=MODS.some(m=>m.id===id&&m.ops);
    if(k==='marine'){if(ops)o[id]='add';return;}
    if(k==='maint'){if(id==='maint')o[id]='full';else if(id==='checks')o[id]='add';return;}
    if(ops)return;
    if(k==='entry'){if(id==='revenues'||id==='expenses')o[id]='add';}
    else if(k==='viewer'){if(lv.indexOf('view')>-1)o[id]='view';}
    else if(k==='acct'){if(id!=='dashboard')o[id]=lv.indexOf('full')>-1?'full':'view';else o[id]='view';}
  });
  return o;
}
function permMatrixHTML(perms){
  return '<div class="perm-grid"><h4>الصلاحيات لكل قسم</h4>'+allModIds().filter(id=>!MODS.some(m=>m.id===id&&m.ops)||modOn(id)||perms[id]).map(id=>{
    const cur=perms[id]||'none';
    return '<div class="perm-row"><b>'+esc(modLabel(id))+'</b><div class="perm-opts">'+modLevels(id).map(l=>'<label><input type="radio" name="perm_'+esc(id)+'" value="'+l+'"'+(cur===l?' checked':'')+'><span>'+LV_LABEL[l]+'</span></label>').join('')+'</div>'+((MODS.find(m=>m.id===id)||{}).help?'<small class="muted perm-mh">'+esc(MODS.find(m=>m.id===id).help)+'</small>':'')+'</div>';
  }).join('')+'<p class="perm-help">'+['view','add','full'].map(l=>'«'+LV_LABEL[l]+'»: '+LV_HELP[l]).join(' ')+'</p></div>';
}
function readPerms(v){
  const o={};
  allModIds().forEach(id=>{const l=v['perm_'+id];if(l&&l!=='none'&&modLevels(id).indexOf(l)>-1)o[id]=l;});
  return o;
}
function userModal(u){
  const edit=!!u;
  const presets='<label class="fld"><span>قالب جاهز</span><select name="preset" data-preset>'+PERM_PRESETS.map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join('')+'</select></label>';
  openModal({title:edit?'تعديل المستخدم':'إضافة مستخدم',
    text:'يدخل المستخدم من شاشة القفل باسمه ورقمه السري، ولا يرى إلا الأقسام التي تمنحه صلاحيتها.'+(edit?' اترك خانتي الرقم فارغتين إن لم ترد تغييره.':''),
    okLabel:edit?'حفظ':'إضافة',
    fields:[{name:'name',label:'اسم المستخدم',plain:true,maxlength:30,value:edit?u.name:''},
      {name:'p1',label:edit?'رقم سري جديد (اختياري)':'الرقم السري',type:'password',inputmode:'numeric',maxlength:10},
      {name:'p2',label:'أعد كتابة الرقم',type:'password',inputmode:'numeric',maxlength:10}],
    extra:presets+permMatrixHTML(edit?u.perms:presetPerms('entry')),
    onSubmit:async v=>{
      const name=(v.name||'').replace(/\s+/g,' ').trim();
      if(!name)return 'اكتب اسم المستخدم';
      if(name==='المدير')return 'هذا الاسم محجوز للمدير — اختر اسمًا آخر';
      if(usersList().some(x=>x.name===name&&(!edit||x.id!==u.id)))return 'يوجد مستخدم بهذا الاسم — اختر اسمًا آخر';
      if(!edit&&usersList().length>=20)return 'بلغت الحد الأقصى من المستخدمين';
      const a=normDigits(v.p1).trim(),b=normDigits(v.p2).trim();
      const wantPin=!edit||a||b;
      if(wantPin){
        if(!/^\d{6,10}$/.test(a))return PIN_RULE;
        if(a!==b)return 'الرقمان غير متطابقين';
      }
      const perms=readPerms(v);
      try{
        if(!edit){
          const id='u'+uid().replace(/[^A-Za-z0-9]/g,'').slice(0,12);
          await manageUser({action:'create',app_id:id,name,perms,pin:a});
        }else{
          await manageUser({action:'update',app_id:u.id,name,perms,...(wantPin?{pin:a}:{})});
        }
        state.settings.users=await hydrateUsers();
        save();render();toast(edit?'تم حفظ التعديل':'تمت إضافة المستخدم');return null;
      }catch(e){return 'حدث خطأ: '+dbErr(e);}
    },
    onOpen:form=>{
      const sel=$('[data-preset]',form);
      sel.addEventListener('change',()=>{
        if(!sel.value)return;
        const p=presetPerms(sel.value);
        allModIds().forEach(id=>{const r=$('input[name="perm_'+id+'"][value="'+(p[id]||'none')+'"]',form);if(r)r.checked=true;});
      });
    }});
}

const SHEET_HELP='اكتب كل عمود في سطر مستقل. للأعمدة الرقمية أضف بعد الاسم «: رقم» وللتواريخ «: تاريخ». مثال: المبلغ : رقم';
function parseSheetCols(text){
  const out=[],seen={};
  String(text||'').split(/\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    const m=line.split(/[:：]/),name=m[0].replace(/\s+/g,' ').trim().slice(0,40),ty=(m[1]||'').trim();
    let type='text';
    if(/^(رقم|عدد|مبلغ|number)$/i.test(ty))type='number';else if(/^(تاريخ|date)$/i.test(ty))type='date';
    if(name&&!seen[name]&&out.length<12){seen[name]=1;out.push({name:name,type:type});}
  });
  return out;
}
const colsToText=cols=>cols.map(c=>c.name+(c.type==='text'?'':' : '+SHEET_TYPES[c.type])).join('\n');
function sheetModal(s){
  const edit=!!s;
  openModal({title:edit?'أعمدة القسم — '+s.name:'إضافة قسم مخصص',text:SHEET_HELP,okLabel:edit?'حفظ':'إضافة',
    fields:(edit?[]:[{name:'name',label:'اسم القسم',plain:true,maxlength:30}]).concat([{name:'cols',label:'الأعمدة',textarea:true,rows:7,maxlength:900,value:edit?colsToText(s.cols):'البيان\nالمبلغ : رقم\nالتاريخ : تاريخ'}]),
    onSubmit:async v=>{
      const cols=parseSheetCols(v.cols);
      if(!cols.length)return 'أدخل عمودًا واحدًا على الأقل';
      if(!edit){
        const name=(v.name||'').replace(/\s+/g,' ').trim().slice(0,30);
        if(!name)return 'أدخل اسم القسم';
        if(state.sheets.length>=20)return 'بلغت الحد الأقصى من الأقسام المخصصة';
        const sh={id:uid(),name:name,cols:cols.map(c=>({id:uid(),name:c.name,type:c.type})),rows:[]};
        state.sheets.push(sh);ui.tab='sheet:'+sh.id;save();render();toast('تمت إضافة القسم');return null;
      }
      const old=s.cols.slice(),used={},next=new Array(cols.length).fill(null);
      cols.forEach((c,i)=>{const o=old.find(x=>!used[x.id]&&x.name===c.name);if(o){used[o.id]=1;next[i]={id:o.id,name:c.name,type:c.type};}});
      cols.forEach((c,i)=>{if(next[i])return;const o=old.find(x=>!used[x.id]&&x.type===c.type);if(o){used[o.id]=1;next[i]={id:o.id,name:c.name,type:c.type};}else next[i]={id:uid(),name:c.name,type:c.type};});
      if(old.some(x=>!used[x.id])&&s.rows.length&&!confirm('سيتم حذف بيانات الأعمدة المحذوفة. هل تريد المتابعة؟'))return 'تم إلغاء التعديل';
      s.cols=next;state.sheets=cleanSheets(state.sheets);save();render();toast('تم حفظ الأعمدة');return null;
    }});
}

$('#fileImport').addEventListener('change',ev=>{
  const file=ev.target.files[0];if(!file||!isAdm()){ev.target.value='';return;}
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const data=JSON.parse(rd.result);
      if(!data||typeof data!=='object'||!Array.isArray(data.accounts))throw new Error('bad');
      if(!confirm('سيؤدي الاسترجاع إلى حذف البيانات الحالية واستبدالها بما في النسخة. هل تريد المتابعة؟'))return;
      applyData(data);save();toast('تم استرجاع النسخة الاحتياطية');
    }catch(err){alert('هذا الملف ليس نسخة احتياطية صالحة.');}
  };
  rd.readAsText(file);
  ev.target.value='';
});
act.fsCreate=async()=>{

    const h=await window.showSaveFilePicker({suggestedName:'accounting-data.json',types:FS_TYPES});
    FS.handle=h;FS.status='ok';FS.err='';
    await persistHandle(h);
    await fsWrite();
    render();if(FS.status==='ok')toast('تم ربط الملف: '+h.name);
  }catch(e){if(e&&e.name==='AbortError')return;toast('تعذّر ربط الملف');}
};
act.fsOpen=async()=>{
  try{
    const sel=await window.showOpenFilePicker({types:FS_TYPES,multiple:false});
    const h=sel[0];
    const perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){toast('يجب السماح بالتعديل على الملف');return;}
    const file=await h.getFile();
    const data=JSON.parse(await file.text());
    if(!data||!Array.isArray(data.accounts))throw new Error('bad');
    if(!confirm('سيتم تحميل البيانات من الملف "'+h.name+'" واستبدال بيانات المتصفح الحالية. هل تريد المتابعة؟'))return;
    applyData(data);
    FS.handle=h;FS.status='ok';FS.err='';
    await persistHandle(h);
    render();toast('تم تحميل البيانات وربط الملف');
  }catch(e){if(e&&e.name==='AbortError')return;alert('هذا الملف ليس ملف بيانات صالحًا، أو لا توجد صلاحية عليه.');}
};
act.fsGrant=async()=>{
  if(!FS.handle)return;
  try{
    const p=await FS.handle.requestPermission({mode:'readwrite'});
    if(p==='granted'){FS.status='ok';FS.err='';await fsReconcile();render();if(FS.status==='ok')toast('تم تفعيل الحفظ في الملف');}
    else toast('يجب السماح بالتعديل على الملف');

function docGuard(k,need){return DOCS[k]&&levelOK(DOCS[k].mod,need);}
const numField=t=>{t=String(t==null?'':t).trim();if(t==='')return {v:null};const v=parseNum(t);return (/\d/.test(normDigits(t))&&isFinite(v)&&v>=0)?{v:v}:{bad:true};};

function negativeAfter(change){
  const before=stockCalc().st,neg0={};
  Object.keys(before).forEach(id=>{if(before[id].qty<0)neg0[id]=1;});
  const snap={p:state.purchases,s:state.sales};
  change();calcReset();
  const after=stockCalc().st,bad=[];
  Object.keys(after).forEach(id=>{if(after[id].qty<0&&!neg0[id]){const pr=prodOf(id);if(pr)bad.push(pr.name);}});
  state.purchases=snap.p;state.sales=snap.s;calcReset();
  return bad;
}
forms.doc=f=>{
  const k=DOCS[f.dataset.dk]?f.dataset.dk:null;if(!k)return;
  const D=DOCS[k],mod=D.mod;
  if(!levelOK(mod,'w'))return;
  const d=new FormData(f),date=d.get('date');
  if(!okDate(date)){toast('اختر التاريخ');return;}
  if(ownOnly(mod)&&!addDateOk(date)){toast('يجب أن يكون التاريخ ضمن آخر 7 أيام حتى اليوم');return;}
  const old=ui.docEdit?docOf(k,ui.docEdit):null;
  if(old&&!canTouch(mod,old)){ui.docEdit=null;render();toast('لا يمكن تعديل هذا الإدخال');return;}
  const ps=d.getAll('l_p'),qs=d.getAll('l_q'),cs=d.getAll('l_c'),lines=[];
  for(let i=0;i<ps.length;i++){
    const pid=ps[i],qt=String(qs[i]==null?'':qs[i]).trim(),ct=String(cs[i]==null?'':cs[i]).trim();
    if(!pid&&!qt&&!ct)continue;
    if(!prodOf(pid)){toast('اختر الصنف في كل سطر');return;}
    const q=numField(qt),c=numField(ct);
    if(q.bad||q.v===null||!(q.v>0)){toast('أدخل كمية صحيحة أكبر من صفر');return;}
    if(c.bad||c.v===null){toast('أدخل '+D.priceLbl+' صحيحة');return;}
    lines.push({pid:pid,qty:rq(q.v),price:ru(c.v)});
  }
  if(!lines.length){toast('أضف صنفًا واحدًا على الأقل');return;}
  const nums={};
  for(const n of ['disc','extra','amount']){
    if(d.get(n)===null){nums[n]=0;continue;}
    const r=numField(d.get(n));
    if(r.bad){toast('أدخل أرقامًا صحيحة غير سالبة');return;}
    nums[n]=round2(r.v||0);
  }
  const partyId=d.get('party')||'';
  if(partyId){const pp=partyOf(partyId);if(!pp||pp.kind!==D.pk){toast('اختر '+D.party+' صحيحًا');return;}}
  const draft={lines:lines,disc:nums.disc,extra:k==='p'?nums.extra:0,paid:nums.amount};
  let sub=0;lines.forEach(l=>{sub+=round2(l.qty*l.price);});
  if(nums.disc>round2(sub)){toast('الخصم أكبر من إجمالي الأصناف');return;}
  const t=docTotals(draft);
  if(nums.amount>t.total){toast('المبلغ أكبر من إجمالي الفاتورة. سجّل الزيادة سندًا من كشف حساب '+D.party);return;}
  if(t.rest>0&&!partyId){toast('اختر '+D.party+' من القائمة أو سدّد كامل المبلغ');return;}
  const accId=nums.amount>0?(d.get('acc')||''):'';
  if(accId&&!getAcc(accId)){toast('الحساب المختار غير موجود');return;}
  const rc=accId?readComm(f,nums.amount):{c:null};
  if(rc.err){toast(rc.err);return;}
  const newShop=rc.c&&rc.c.by==='shop'?rc.c.a:0;

  if(k==='p'){
    if(accId){const dl=-(nums.amount+newShop)+((old&&old.accountId===accId)?old.paid+shopComm(old):0);if(!okBalance(accId,dl))return;}
  }else if(old&&old.accountId){
    const oldNet=old.paid-shopComm(old),newNet=accId?nums.amount-newShop:0;
    const dl=(old.accountId===accId)?(newNet-oldNet):-oldNet;
    if(dl<0&&!okBalance(old.accountId,dl))return;
  }
  const doc={id:old?old.id:uid(),n:old?old.n:nextDocNo(k),ref:cstr(d.get('ref'),30),date:date,partyId:partyId,lines:lines,disc:nums.disc,note:cstr(d.get('note'),200),paid:t.paid,accountId:accId};
  if(k==='p')doc.extra=nums.extra;
  if(rc.c)doc.comm=rc.c;
  if(old){doc.by=old.by;doc.at=old.at;}else{doc.by=UID;doc.at=Date.now();}

  const arr=state[D.key];
  const apply=()=>{state[D.key]=old?arr.map(x=>x.id===old.id?doc:x):arr.concat([doc]);};
  if(k==='s'){
    const need={};lines.forEach(l=>{need[l.pid]=(need[l.pid]||0)+l.qty;});
    const short=[];
    Object.keys(need).forEach(pid=>{
      let av=stockOf(pid).qty;
      if(old)old.lines.forEach(l=>{if(l.pid===pid)av+=l.qty;});
      if(need[pid]>av+1e-9)short.push(prodOf(pid).name+' (المتاح '+qtyTxt(Math.max(av,0))+')');
    });
    if(short.length&&!confirm('الكمية المطلوبة أكبر من المتاح في المخزن للأصناف التالية:\n'+short.join('\n')+'\n\nهل تريد المتابعة؟'))return;
    if(costVisible()){
      const below=[];
      lines.forEach(l=>{const a=stockOf(l.pid).avg;if(a>0&&l.price<a-1e-9)below.push(prodOf(l.pid).name+' (التكلفة '+fmt(a)+' والبيع '+fmt(l.price)+')');});
      if(below.length&&!confirm('سعر البيع أقل من تكلفة الأصناف التالية:\n'+below.join('\n')+'\n\nهل تريد المتابعة؟'))return;
    }
  }else if(old){
    const bad=negativeAfter(apply);
    if(bad.length&&!confirm('هذا التعديل سيجعل رصيد الأصناف التالية سالبًا:\n'+bad.join('\n')+'\n\nهل تريد المتابعة؟'))return;
  }
  apply();ui.docEdit=null;save();render();
  toast(old?'تم حفظ التعديل':'تم تسجيل '+D.one+' رقم '+doc.n);
};

function allTradeSheets(){
  if(!anyTrade())return [];
  const out=[];
  if(state.sales.length)out.push(docsSheet('s',filterList(state.sales,'all'),'كل فواتير البيع'));
  if(state.purchases.length)out.push(docsSheet('p',filterList(state.purchases,'all'),'كل فواتير الشراء'));
  if(state.parties.some(p=>p.kind==='c'))out.push(partiesSheet('c'));
  if(state.parties.some(p=>p.kind==='s'))out.push(partiesSheet('s'));
  if(state.products.length)out.push(stockSheet());
  if(state.sales.length){
    const sv=[ui.prfView,ui.prfYear,ui.prfMon];
    ui.prfView='all';ui.prfYear='';ui.prfMon='';
    try{out.push.apply(out,profitSheets());}finally{ui.prfView=sv[0];ui.prfYear=sv[1];ui.prfMon=sv[2];}
  }
  return out;
}

function readCkItems(f,old){
  const d=new FormData(f),ids=d.getAll('i_id'),ts=d.getAll('i_t'),ws=d.getAll('i_w');

  const prev={};(old||[]).forEach(i=>{prev[i.id]=i;});
  const items=[];
  for(let i=0;i<ts.length&&items.length<60;i++){
    const t=cstr(ts[i],120);if(!t)continue;
    const id=(ids[i]&&prev[ids[i]])?ids[i]:uid();

    if(!ok[w]&&!(prev[id]&&prev[id].w===w))return {err:'المسؤول عن البند «'+t+'» غير متاح'};

const themeRoleOK=r=>THEME_ROLES.some(x=>x[0]===r);

function paintThemeRole(role,except){
  const box=document.querySelector('.th-role[data-role="'+role+'"]');if(!box)return;
  const t=cleanTheme(state.settings.theme),c=t[role];
  const sw=$('.th-sw',box);if(sw)sw.style.background=thHex(c);
  const hx=$('.th-hex',box);if(hx)hx.textContent=thHex(c);
  const pk=$('[data-th-pick]',box);if(pk&&pk!==except)pk.value=thHex(c);
  for(let i=0;i<3;i++){
    const rg=$('[data-th="'+role+'.'+i+'"]',box),nb=$('[data-thn="'+role+'.'+i+'"]',box);
    if(rg&&rg!==except)rg.value=c[i];
    if(nb&&nb!==except)nb.value=c[i];
  }
  const adj=themeAdjusted(t),nt=$('[data-adj="'+role+'"]',box);
  if(nt)nt.hidden=!adj[role];
  $$('#themeCard .th-pre').forEach(b=>{
    const p=THEME_PRESETS.find(x=>x[0]===b.dataset.p);
    b.classList.toggle('on',!!p&&p[2].join()===t.pri.join()&&p[3].join()===t.hdr.join()&&p[4].join()===t.bg.join());
  });
}
function themeSetChan(role,i,val,except){
  const t=cleanTheme(state.settings.theme);
  t[role][i]=Math.max(0,Math.min(255,Math.round(val)));
  state.settings.theme=t;
  applyTheme();paintThemeRole(role,except);themeSaveSoon();
}

async function cloudPull(users){

    const r=await CLOUD.sb.from('shop_records').select('collection,id,data').order('collection').order('id').range(page*1000,page*1000+999);
    if(r.error)throw r.error;
    rows.push(...(r.data||[]));if(!r.data||r.data.length<1000)break;page++;
  }
  const st=defaultState();st.accounts=[];st.sheets=[];
  rows.filter(r=>r.collection==='sheets').forEach(r=>st.sheets.push({...r.data,rows:[]}));

async function cloudPush(){
  if(!CLOUD.sb||!CLOUD.session||!CLOUD.synced||CLOUD.blocked)return;
  if(CLOUD.pushBusy){CLOUD.pushAgain=true;return;}
  CLOUD.pushBusy=true;
  const snap=snapOf(state),base=CLOUD.synced,changes=[];
  Object.keys(snap).forEach(col=>{
    const nowM=snap[col],oldM=base[col]||{};
    Object.keys(nowM).forEach(id=>{if(oldM[id]!==nowM[id])changes.push({collection:col,id,data:JSON.parse(nowM[id]),expected:oldM[id]?JSON.parse(oldM[id]):null});});
    Object.keys(oldM).forEach(id=>{if(!(id in nowM))changes.push({collection:col,id,data:null,expected:JSON.parse(oldM[id])});});
  });
  try{
    if(changes.length){
      const r=await CLOUD.sb.rpc('apply_shop_changes',{changes});
      if(r.error)throw r.error;
      (r.data||[]).forEach(row=>{
        const before=snap[row.collection]&&snap[row.collection][row.id];
        if(row.data!==null){
          const server=stableJSON(row.data);
          if(snapOf(state)[row.collection][row.id]===before)upsertLocal(row.collection,row.id,row.data);
          snap[row.collection][row.id]=server;

    }
    CLOUD.synced=snap;
    if(CLOUD.profile&&CLOUD.profile.is_admin){
      const {error}=await CLOUD.sb.from('shop_public').upsert({id:1,name:state.settings.shopName||'',logo:state.settings.logo||'',updated_at:new Date().toISOString()});
      if(error)console.warn('public shop label update failed');
    }
    CLOUD.dirty=JSON.stringify(snapOf(state))!==JSON.stringify(snap);
    cloudStatus(CLOUD.dirty?'جارٍ حفظ التغييرات على الخادم...':'تم الحفظ على الخادم ✓',false);
  }catch(e){
    console.warn('cloud save failed',e&&e.code);
    if(String(e&&e.message||'').includes('SHOP_CONFLICT')){
      CLOUD.blocked=true;cloudStatus('تعارض تعديل: لم تُحفظ آخر تغييراتك. صدّر نسخة احتياطية قبل إعادة التحميل.',true);
      alert('عدّل مستخدم آخر نفس البيانات. لم يتم حفظ تغييراتك الأخيرة. احتفظ بنسخة احتياطية ثم أعد تحميل الصفحة لمراجعة البيانات الحالية.');
    }else if(e&&['42501','23505'].includes(e.code)){
      CLOUD.blocked=true;cloudStatus('لم يتم الحفظ: صلاحيات غير كافية أو بيانات متعارضة. أعد التحميل بعد حفظ نسخة.',true);
    }else{
      cloudStatus('غير محفوظ على الخادم. تحقق من الإنترنت، ستُعاد المحاولة.',true);
      clearTimeout(CLOUD.pushT);CLOUD.pushT=setTimeout(cloudPush,15000);
    }
  }finally{
    CLOUD.pushBusy=false;
    if(!CLOUD.blocked&&(CLOUD.pushAgain||CLOUD.dirty)&&CLOUD.status.indexOf('غير محفوظ')<0){CLOUD.pushAgain=false;CLOUD.pushT=setTimeout(cloudPush,500);}
    else if(!CLOUD.dirty&&CLOUD.refreshPending)queueCloudRefresh();
  }
}
function cloudRefreshSafe(){
  if(locked||!CLOUD.session||CLOUD.dirty||CLOUD.pushBusy||CLOUD.blocked||ui.sheetEdit||ui.editExp||ui.editRev||ui.editTxn||ui.eqEdit||ui.ckForm||document.querySelector('.modal-box')||document.getElementById('ownerAccess'))return false;
  const el=document.activeElement;
  return !(el&&['INPUT','TEXTAREA','SELECT'].includes(el.tagName));
}
function queueCloudRefresh(){
  CLOUD.refreshPending=true;clearTimeout(CLOUD.refreshT);
  CLOUD.refreshT=setTimeout(async()=>{
    if(!cloudRefreshSafe())return;
    // A response requested before an edit must never replace that newer edit.
    const oldState=state,oldSynced=CLOUD.synced,oldUser=CLOUD.session.user.id;
    const stillCurrent=()=>cloudRefreshSafe()&&state===oldState&&CLOUD.synced===oldSynced&&CLOUD.session.user.id===oldUser;
    try{
      const users=await hydrateUsers(),my=await fetchMyProfile();
      if(!stillCurrent())return;
      if(!my||my.active===false){lockApp();return;}
      const pulled=await cloudPull(users);
      if(!stillCurrent())return;
      CLOUD.profile=my;state=pulled.state;CLOUD.synced=pulled.synced;
      CLOUD.refreshPending=false;calcReset();snapClosed();render();
    }catch(e){console.warn('cloud refresh failed');}
  },800);
}

function upsertLocal(col,id,data){
  if(col==='sheet_rows'){const sh=state.sheets.find(x=>x.id===id.split(':')[0]);if(sh){const i=sh.rows.findIndex(r=>r.id===data.id);if(i<0)sh.rows.push(data);else sh.rows[i]=data;}return;}
  if(col==='sheets'){const sh=state.sheets.find(x=>x.id===id);if(sh)Object.assign(sh,data);else state.sheets.push({...data,rows:[]});return;}

  if(col==='settings'){if(id==='main'&&data&&typeof data==='object'){Object.assign(state.settings,data);state.settings.pin={salt:'cloud',hash:'cloud'};}return;}
  if(col==='payroll'){state.payroll[id]=data;return;}
  const arr=state[col];if(!Array.isArray(arr))return;
  const i=arr.findIndex(r=>r&&r.id===id);
  if(i>-1)arr[i]=data;else arr.push(data);
}
function removeLocal(col,id){
  if(col==='settings')return;
  if(col==='payroll'){delete state.payroll[id];return;}
  const arr=state[col];if(!Array.isArray(arr))return;
  const i=arr.findIndex(r=>r&&r.id===id);if(i>-1)arr.splice(i,1);
}
function startRealtime(){
  stopRealtime();
  CLOUD.rt=CLOUD.sb.channel('shop-live-'+Math.random().toString(36).slice(2))
    .on('postgres_changes',{event:'*',schema:'public',table:'shop_records'},queueCloudRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},queueCloudRefresh)
    .subscribe();
  // Five-second app-data reconciliation also covers revoked permissions and deletes.
  CLOUD.poll=setInterval(queueCloudRefresh,5000);
}
function stopRealtime(){clearInterval(CLOUD.poll);clearTimeout(CLOUD.refreshT);if(CLOUD.rt){try{CLOUD.sb.removeChannel(CLOUD.rt);}catch(e){}CLOUD.rt=null;}}
async function cloudSignOut(){
  stopRealtime();

  clearTimeout(CLOUD.pushT);CLOUD.session=null;CLOUD.profile=null;CLOUD.synced=null;CLOUD.dirty=false;CLOUD.blocked=false;cloudStatus('',false);
}
async function enterCloud(prof){

async function showLockFirst(){

    if(!r.error&&r.data)state.settings.users=r.data.map(d=>({id:d.app_id,name:d.name,pin:{salt:'cloud',hash:'cloud'},perms:{},active:true}));
  }catch(e){}

async function bootCloud(){
  try{CLOUD.sb=supabase.createClient(SUPA_URL,SUPA_ANON);}catch(e){CLOUD.sb=null;}
  load();
  if(!CLOUD.sb){document.body.classList.add('locked');$('#lockErr').textContent='تعذّر الاتصال. تحقق من الإنترنت وأعد التحميل.';return;}

<script>
/* motion layer: purely visual, never touches app data */
(function(){
  var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function countUp(root){
    if(RM||document.documentElement.getAttribute('data-motion')==='off')return;
    root.querySelectorAll('.stat .val .num').forEach(function(el){
      var final=el.textContent,m=final.match(/-?[\d,]*\.?\d+/);
      if(!m||/[٠-٩]/.test(final))return;
      var raw=m[0],target=parseFloat(raw.replace(/,/g,''));
      if(!isFinite(target)||target===0)return;
      var dec=(raw.split('.')[1]||'').length,comma=raw.indexOf(',')>-1,t0=performance.now(),D=900;
      function fmtN(v){var s=Math.abs(v).toFixed(dec);if(comma)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,',');return (v<0?'-':'')+s}
      function step(t){
        var p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,4);
        if(p<1){el.textContent=final.replace(raw,fmtN(target*e));requestAnimationFrame(step)}else el.textContent=final;
      }
      el.textContent=final.replace(raw,fmtN(0));requestAnimationFrame(step);
    });
  }
  function enter(tab){
    if(RM||document.documentElement.getAttribute('data-motion')==='off')return;
    countUp(tab);
    setTimeout(function(){tab.classList.remove('enter')},1400);
  }
  document.querySelectorAll('.tab').forEach(function(t){
    new MutationObserver(function(ms){
      ms.forEach(function(m){if(m.attributeName==='class'&&t.classList.contains('active')&&!m.oldValue.split(' ').includes('active'))enter(t)});
    }).observe(t,{attributes:true,attributeOldValue:true,attributeFilter:['class']});
  });
  var a=document.querySelector('.tab.active');if(a)enter(a);
})();
</script>
</body>
