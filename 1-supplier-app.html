<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابات المحل</title>
<style>
:root{--bg:#eef4f7;--card:#fff;--ink:#17262f;--muted:#667885;--line:#d9e4ea;--pri:#0b6e8a;--pri-d:#08546a;--pri-l:#e2f1f6;--pri-b:#b9dbe6;--pri-ll:#d3eef6;--hdr-a:#08546a;--hdr-b:#0b8aa8;--ok:#14784a;--ok-l:#e4f5ec;--bad:#c0392b;--bad-l:#fdeceb;--warn:#a96a0a;--warn-l:#fdf3df;--r:14px;--sh1:0 1px 2px rgba(11,60,80,.06),0 4px 14px rgba(11,60,80,.06);--sh2:0 2px 4px rgba(11,60,80,.08),0 12px 30px rgba(11,60,80,.14);--ease:cubic-bezier(.22,.8,.25,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif}
h1,h2,h3{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:20px}
.logo{font-size:26px;line-height:1}
.logo img{height:36px;max-width:120px;object-fit:contain;border-radius:6px;background:#fff;padding:2px;vertical-align:middle}
.mp{display:flex;align-items:center;gap:6px}
.mp select{background:#fff;border:0;border-radius:8px;padding:6px 8px;color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ghost{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:6px 12px}
.ghost:hover{background:rgba(255,255,255,.28)}
.chip{font:inherit;font-size:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;color:#fff;cursor:pointer}
.chip.warn{background:#fdf3df;color:#a96a0a;border-color:#f0d9a8}
nav{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:transparent;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
nav button.active{color:var(--pri);border-bottom-color:var(--pri);background:var(--pri-l)}
main{max-width:1180px;margin:0 auto;padding:16px}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h3{font-size:17px;margin-bottom:10px}
.card summary{cursor:pointer;font-weight:700;font-size:17px}
.card.danger{border-color:#efc3be;background:#fffafa}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .lbl{display:block;color:var(--muted);font-size:14px}
.stat .val{display:block;font-size:24px;margin-top:2px}
.stat .sub{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.stat.big{background:var(--pri);border-color:var(--pri);color:#fff}
.stat.big .lbl,.stat.big .sub{color:var(--pri-ll)}
.stat.big.loss{background:var(--bad);border-color:var(--bad)}
.stat.big.loss .lbl,.stat.big.loss .sub{color:#fbd9d5}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.fld input,.fld select,.fld textarea,.in{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);width:100%;font-size:16px}
.fld textarea{font-family:inherit;resize:vertical;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus,.in:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
input:disabled,select:disabled{background:#f1f5f7;color:#444;opacity:1}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:#e7eef2;color:var(--ink)}
.btn.pri{background:var(--pri);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.sec{background:#fff;border:1px solid var(--line)}
.btn:hover{filter:brightness(.95)}
a.btn{display:inline-block;text-decoration:none}
.support-foot{text-align:center;color:var(--muted);font-size:14px;padding:18px 0 8px}
.icon{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px}
.icon.del{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.spacer{flex:1}
.formula{margin:10px 0 0;color:var(--muted);font-size:14px;background:var(--pri-l);border-radius:10px;padding:8px 12px}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px}
.banner .btn{padding:5px 12px;margin-inline-start:8px}
.banner.ok{background:var(--ok-l);color:var(--ok)}
.banner.tip{background:var(--pri-l);color:var(--pri-d);border:1px solid var(--pri-b)}
.banner.trial{background:var(--pri-l);color:var(--pri-d);border:1px solid var(--pri-b)}
.banner.warn,.warn-banner{background:var(--warn-l);color:var(--warn)}
.warn-banner{padding:10px 16px}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.note.warn{color:var(--warn)}
.note:empty{display:none}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{background:#f4f8fa;color:var(--muted);font-size:14px;text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #edf2f5;vertical-align:middle}
tfoot td{background:#f4f8fa;font-weight:700;border-bottom:0}
tr.cur td{background:var(--pri-l)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.muted{color:var(--muted)}
.pay-table:not(.has-lg) .lg-col{display:none}
.linkname{border:0;background:transparent;color:var(--pri);font-weight:700;font-size:inherit;padding:2px 0;text-align:start;cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.prseg{max-width:700px}
.item-table{width:100%;border-collapse:collapse}.item-table th,.item-table td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}.item-table th{background:#f1f5f8;font-weight:600}
.led-table tfoot td{font-weight:700}.led-table td.net{font-weight:700}
.emp-table tr.inactive{opacity:.55}
.cm-box{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:6px 12px;background:#fafcfd}.cm-box>summary{cursor:pointer;font-weight:600;padding:4px 0}.cm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}.cm-note{font-size:13px;color:var(--muted)}
.fee-row{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}.fee-in{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.fee-in .fld span{font-size:12px}
.att-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0}
.att-table{border-collapse:collapse;font-size:13px;min-width:100%}
.att-table th,.att-table td{border:1px solid var(--line);padding:0;text-align:center;min-width:26px;height:34px}
.att-table thead th{background:var(--pri-l);font-size:12px;height:26px;color:var(--pri-d)}
.att-table thead th.dw{font-weight:400;color:var(--muted)}
.att-table th.tdy{background:var(--pri);color:#fff}
.att-table .nm{position:sticky;right:0;background:#fff;min-width:104px;padding:0 8px;text-align:start;z-index:1}
.att-table thead .nm{background:var(--pri-l)}
.att-table td.att-c{cursor:pointer;user-select:none;font-weight:700;position:relative}
.att-table td.att-c small{display:block;font-size:10px;font-weight:400;line-height:1;margin-top:-6px}
.att-table .tot{min-width:38px;font-weight:700;background:#fafafa}
.a-p{background:#e6f6ec;color:#12803a}.a-a{background:#fde8e8;color:#c0392b}.a-l{background:#fff4d6;color:#a06a00}.a-o{background:#eceff3;color:#667885}
.wk{box-shadow:inset 0 0 0 40px rgba(0,0,0,.06)}
.att-table td.att-c,.cal .cd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.day-top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.day-top .fld{margin:0;min-width:170px}.downame{font-weight:700;color:var(--pri);padding-bottom:10px}
.day-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.day-row>b{flex:1;min-width:110px}
.sg{display:flex;gap:4px;flex-wrap:wrap}
.sg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-weight:600;color:var(--muted);font-size:14px}
.sg button.on.p{background:#e6f6ec;color:#12803a;border-color:#12803a}.sg button.on.a{background:#fde8e8;color:#c0392b;border-color:#c0392b}
.sg button.on.l{background:#fff4d6;color:#a06a00;border-color:#a06a00}.sg button.on.o{background:#eceff3;color:#445;border-color:#778}
.day-row input.n{width:74px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.cal .ch{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.cal .cd{border:1px solid var(--line);border-radius:10px;padding:4px 2px;text-align:center;cursor:pointer;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;user-select:none;background:#fff}
.cal .cd.empty{border:0;cursor:default;background:transparent}
.cal .cd .dn{font-size:11px;color:var(--muted)}.cal .cd .ds{font-size:20px;font-weight:700;line-height:1}.cal .cd small{font-size:11px;line-height:1.1}
.cal .cd.tdy{outline:2px solid var(--pri)}
.cal-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sumbox{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sumbox .sl{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line)}
.sumbox .sl:last-child{border-bottom:0}.sumbox .sl.net{background:var(--pri);color:#fff;font-size:18px}.sumbox .sl.bad b{color:var(--bad)}.sumbox .sl.warn{background:#fff7e0;color:var(--warn)}
.emp-table tr.inactive td{opacity:.55}
.pay-table input.name{min-width:150px}
.pay-table input.n{width:96px;text-align:center;direction:ltr}
.pay-table td.net{font-weight:700;font-size:17px}
.pay-table tr.row-neg td.net{color:var(--bad)}
.pay-table td.act,td.act{white-space:nowrap}
.idx{color:var(--muted);width:30px}
.empty td{text-align:center;color:var(--muted);padding:22px}
.tag{display:inline-block;font-size:12px;background:var(--pri-l);color:var(--pri);border-radius:6px;padding:0 6px;margin-inline-start:4px}
.in-c{color:var(--ok);font-weight:600}.out-c{color:var(--bad);font-weight:600}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.acc .nm{font-weight:700}
.acc .bl{font-size:24px;margin:2px 0}
.acc .op{color:var(--muted);font-size:13px}
.acc .row{display:flex;gap:6px;margin-top:8px}
.bar-row{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;margin:6px 0}
.bar{background:#eaf1f4;border-radius:6px;height:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.bar i.g{background:var(--ok)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.filters .fld{min-width:170px}
.sum-card{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;padding:12px 16px}.sum-card b.num{font-size:18px}
.stmt-meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);margin-bottom:6px}.stmt-meta b{color:var(--ink)}.stmt-bal{font-size:18px;font-weight:700;margin-top:4px}
.off-row td{opacity:.6}
.doc-lines{margin-top:12px}.doc-head,.doc-line{display:grid;grid-template-columns:minmax(150px,3fr) minmax(70px,1fr) minmax(80px,1.2fr) minmax(80px,1fr) 38px;gap:6px;align-items:center;margin-bottom:6px}.doc-head{font-size:13px;color:var(--muted);font-weight:600}.doc-line select,.doc-line input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 8px;background:#fff;color:var(--ink);font-size:16px;min-width:0}.doc-line .l-tot{text-align:center}.doc-line .l-hint{grid-column:1/-1;margin-top:-3px}.doc-line .l-hint:empty{display:none}
.doc-sum{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;margin-top:10px;padding:10px 12px;background:var(--pri-l);border-radius:10px}.doc-sum b{font-size:17px}
.inv .inv-head{margin-bottom:6px}.inv-tot{margin:10px 0 0 auto;width:min(360px,100%);border-collapse:collapse}.inv-tot td{padding:6px 10px;border:1px solid var(--line)}.inv-tot tr.g td{font-weight:700;background:#f4f8fa}.inv-words{margin:10px 0;font-weight:600}.inv-sign{display:flex;justify-content:space-between;gap:20px;margin-top:34px;padding:0 20px}.inv-sign span{border-top:1px solid var(--muted);min-width:140px;text-align:center;padding-top:6px;color:var(--muted)}
@media(max-width:640px){.doc-head{display:none}.doc-line{grid-template-columns:1fr 1fr 1fr 38px}.doc-line select{grid-column:1/-1}.doc-line .l-tot{grid-column:3}.doc-line .icon{grid-column:4}}a.ph{color:inherit;direction:ltr;unicode-bidi:isolate;display:inline-block}
@media(max-width:640px){table.trend{width:100%;min-width:0;table-layout:fixed}table.trend th{font-size:10px;padding:7px 1px}table.trend td{padding:7px 2px;font-size:11.5px}table.trend th,table.trend td{white-space:normal;text-align:center;word-break:normal}table.trend th:first-child,table.trend td:first-child{width:17%;text-align:right}}
.filters input[type=search]{-webkit-appearance:none;appearance:none}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(30px);background:#17262f;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.print-head,.print-foot,.print-only,#slips{display:none}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;align-items:start}
.set-grid .card{margin-bottom:0}
.logo-prev{max-height:70px;max-width:220px;border:1px dashed var(--line);border-radius:10px;padding:4px;background:#fff;display:block;margin:6px 0}
.status-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-l);color:var(--ok)}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.pill.off{background:#eceff1;color:var(--muted)}
.stack{display:grid;gap:10px}
[hidden]{display:none!important}
.modal-box input.plain{text-align:start;letter-spacing:0;direction:rtl}
#lock,#trialEnd{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));display:none;align-items:center;justify-content:center;padding:16px}
body.locked #lock{display:flex}
body.trial-over #trialEnd{display:flex}
body.trial-over #lock{display:none!important}
body.trial-over header,body.trial-over nav,body.trial-over main,body.trial-over #slips,body.trial-over #storeWarn,body.trial-over #modal{display:none!important}
body.locked header,body.locked nav,body.locked main,body.locked #slips,body.locked #storeWarn{display:none!important}
.lock-box{background:#fff;border-radius:18px;padding:26px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.lock-box .logo{font-size:46px}
.lock-box .logo img{height:64px;max-width:200px}
.lock-box h2{font-size:20px;margin:6px 0 2px}
.lock-box p{margin:4px 0 12px;color:var(--muted)}
.lock-box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;text-align:center;letter-spacing:6px;font-size:22px;direction:ltr;margin-bottom:10px}
.lock-box input:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.lock-box .btn{width:100%}
.lock-err{color:var(--bad);min-height:1.5em;margin:8px 0 0!important}
.lock-ok{color:var(--ok);min-height:1.5em;margin:8px 0 0!important}
#trialEnd .lock-box{max-width:400px}
#licRow{margin:12px 0;padding-top:12px;border-top:1px solid var(--line)}
#licRow textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;text-align:center;letter-spacing:1px;font-size:16px;direction:ltr;margin-bottom:10px;resize:none;font-family:inherit}
#licRow textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.lic-iid{font-size:13px;margin:6px 0 0!important}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 12px;background:var(--pri-l);border-radius:12px;padding:4px}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted);font-size:15px}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.lock-hint{font-size:13px;color:var(--muted);margin:10px 0 0!important}
.link{background:none;border:0;color:var(--pri);text-decoration:underline;margin-top:10px;font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#modal{position:fixed;inset:0;z-index:90;background:rgba(10,25,35,.55);display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:18px 20px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto}
.modal-box h3{margin-bottom:8px}
.modal-box .fld{margin-bottom:10px}
.modal-box input{text-align:center;letter-spacing:4px;direction:ltr}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal-err{color:var(--bad);min-height:1.4em;font-size:14px}
.slip{border:1px solid #444;border-radius:8px;padding:12px 16px;margin-bottom:9mm;break-inside:avoid;page-break-inside:avoid;font-size:13px;color:#000;background:#fff}
.slip-head{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.slip-head img{max-height:48px;max-width:110px;object-fit:contain}
.slip-brand{flex:1;padding:0 10px}
.slip-brand b{font-size:16px}
.slip-brand small{display:block;color:#444}
.slip-title{text-align:center;font-weight:700;font-size:15px}
.slip-title small{display:block;font-weight:400}
.slip-emp{margin:4px 0 6px;font-size:15px}
.slip table{width:100%;border-collapse:collapse;margin:4px 0}
.slip td{padding:4px 8px;border:1px solid #bbb}
.slip td:first-child{background:#f3f3f3;width:58%}
.slip td:last-child{text-align:left}
.slip-net{display:flex;justify-content:space-between;background:#eee;padding:8px 10px;font-size:16px;font-weight:700;border:1px solid #444;margin:6px 0 2px}
.slip-words{font-size:13px;margin:2px 0 4px}
.slip-sign{display:flex;justify-content:space-between;margin-top:26px}
.slip-sign span{border-top:1px solid #000;padding-top:3px;min-width:150px;text-align:center}
.slip-foot{color:#555;font-size:11px;margin-top:8px}
@media (max-width:760px){
  
  .tbl-wrap table:not(.pay-table) th,.tbl-wrap table:not(.pay-table) td{padding:8px 5px;font-size:14px}
  .tbl-wrap table:not(.pay-table) .icon{padding:3px 6px;margin:1px 0}
  .tbl-wrap table:not(.pay-table) td.act{white-space:normal;width:1%}
  .tbl-wrap table:not(.pay-table) .empty td{padding:22px 8px}

const T_TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const T_HUND=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function words3(n){
  const h=Math.floor(n/100),r=n%100,parts=[];
  if(h)parts.push(T_HUND[h]);
  if(r){
    if(r<20)parts.push(T_ONES[r]);
    else{const u=r%10,t=Math.floor(r/10);parts.push(u?T_ONES[u]+' و'+T_TENS[t]:T_TENS[t]);}
  }
  return parts.join(' و');
}
function scaleWords(g,one,two,few,many){
  if(g===1)return one;
  if(g===2)return two;
  const r=g%100;
  let w=words3(g);
  if(r===0&&Math.floor(g/100)===2)w='مائتا';
  if(r>=3&&r<=10)return w+' '+few;
  if(r>=11)return w+' '+many;
  return w+' '+one;
}
function intWords(n){
  const parts=[];
  const mil=Math.floor(n/1e6),th=Math.floor((n%1e6)/1000),rest=n%1000;
  if(mil)parts.push(scaleWords(mil,'مليون','مليونان','ملايين',(th||rest)?'مليوناً':'مليون'));
  if(th)parts.push(scaleWords(th,'ألف','ألفان','آلاف',rest?'ألفاً':'ألف'));
  if(rest)parts.push(words3(rest));
  return parts.join(' و');
}
function unitForm(n,w){
  if(n===1)return w.one;
  if(n===2)return w.two;
  const r=n%100;
  const word=(r>=3&&r<=10)?w.few:(r>=11?w.many:w.zero);
  return intWords(n)+' '+word;
}
function tafqeet(amount){
  amount=round2(Math.abs(+amount||0));
  let pounds=Math.floor(amount+1e-9),pi=Math.round((amount-pounds)*100);
  if(pi>=100){pounds+=1;pi=0;}
  if(pounds>=1e9)return '';
  const PW={one:'جنيه واحد',two:'جنيهان',few:'جنيهات',many:'جنيهاً',zero:'جنيه'};
  const QW={one:'قرش واحد',two:'قرشان',few:'قروش',many:'قرشاً',zero:'قرش'};
  const out=[];
  if(pounds>0)out.push(unitForm(pounds,PW));
  if(pi>0)out.push(unitForm(pi,QW));
  if(!out.length)return 'صفر جنيه';
  return 'فقط '+out.join(' و')+' لا غير';
}

  const n=daysIn(m),att=r.att||{},hrs=r.hrs||{},late=r.late||{};

function calcAtt(r,p){
  const e=empOf(r),m=p.m,n=daysIn(m),R=prRules();
  const pay=e?empPay(e,m):{rate:0,basis:'hour'};
  const rate=String(r.rate==null?'':r.rate).trim()!==''?nn(r.rate):pay.rate,basis=PAY_BASIS[r.pb]?r.pb:pay.basis;
  let hpd=String(r.hpd==null?'':r.hpd).trim()!==''?nn(r.hpd):(e?nn(e.hpd):8);
  if(!(hpd>0))hpd=8;
  const off=e?e.off:5;
  const dn=(v,d)=>(v==null||v==='')?d:nn(v);
  const ot=dn(e&&e.ot,1),absM=dn(e&&e.absMult,1),lateM=dn(e&&e.lateMult,1),restPaid=!!(e&&e.restPaid);
  const st=attStats(r,m,hpd,off),extra=nn(r.extraH);

  let dv;

  else if(basis==='week')dv=rate/(off>=0?6:7);
  else dv=rate/(R.div>0?R.div:n);
  const hv=dv/hpd;
  const paidRest=restPaid?st.rest:0,paidHol=R.holPaid?st.holiday:0;
  const otH=st.otH+extra;
  let base,absLoss=0,units,hours;
  if(basis==='hour'){
    hours=round2(st.hours+extra+(paidRest+paidHol)*hpd);
    base=(st.hours-st.otH+(paidRest+paidHol)*hpd)*rate;
    units=hours;
  }else if(basis==='day'){
    hours=round2(st.hours+extra);
    units=st.present+st.leave+paidRest+paidHol;
    base=units*rate;
  }else{
    hours=round2(st.hours+extra);
    units=basis==='month'?1:round2(n/7);
    base=basis==='month'?rate:rate*n/7;
    absLoss=st.absent*dv*absM;
  }
  const otAmt=basis==='hour'?otH*rate*ot:otH*hv*ot;
  const holExtra=(R.holMult-1)*(basis==='hour'?st.holHours*rate:st.holWork*dv);
  const gross=round2(base+otAmt+holExtra-absLoss);
  const absPen=(basis==='hour'||basis==='day')?round2(st.absent*dv*Math.max(0,absM-1)):0;
  const late=round2(st.lateMin/60*hv*lateM);
  const items=round2(itemsOf(r,'deduct').reduce((a,x)=>a+x.amount,0)+nn(r.penalty));
  const bonus=round2(itemsOf(r,'bonus').reduce((a,x)=>a+x.amount,0)+nn(r.bonus));
  const pen=round2(items+late+absPen);
  const cost=round2(gross+bonus-pen);
  const ins=round2(Math.max(0,gross)*dn(e&&e.ins,0)/100),tax=round2(Math.max(0,cost-ins)*dn(e&&e.tax,0)/100);
  const pre=round2(cost-ins-tax),adv0=nn(r.advance);
  const empId=r.empId,list=advList(empId);
  const sched=advSched(list,m),cin=advCarry(empId,m),due=round2(sched+cin);
  const applied=round2(Math.min(due,Math.max(0,pre-adv0)));
  return {att:true,basis:basis,units:units,st:st,extra:extra,otH:round2(otH),otAmt:round2(otAmt),holExtra:round2(holExtra),absLoss:round2(absLoss),base:round2(base),
    hours:hours,rate:rate,off:st.absent,hpd:hpd,gross:gross,offAmt:0,eff:0,bonus:bonus,pen:pen,penItems:items,late:late,absPen:absPen,ins:ins,tax:tax,
    advSched:sched,advCarryIn:cin,advApplied:applied,advCarryOut:round2(due-applied),adv:round2(adv0+applied),
    cost:cost,net:round2(pre-adv0-applied)};
}
function calcRow(r,p){

const QR=(function(){

    L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]
  };
  const BLK={
    L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]
  };
  const FMT={L:1,M:0};
  function rawModules(v){
    let r=(16*v+128)*v+64;
    if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36;}
    return r;
  }
  const dataWords=(v,e)=>Math.floor(rawModules(v)/8)-ECC[e][v]*BLK[e][v];
  function gmul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z;}
  function rsDiv(deg){
    const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;
    for(let i=0;i<deg;i++){
      for(let j=0;j<deg;j++){r[j]=gmul(r[j],root);if(j+1<deg)r[j]^=r[j+1];}
      root=gmul(root,2);
    }
    return r;
  }
  function rsRem(data,div){
    const r=div.map(()=>0);
    data.forEach(b=>{const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=gmul(c,f);});});
    return r;
  }
  function alignPos(v){
    if(v===1)return [];
    const n=Math.floor(v/7)+2,step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2,res=[6];
    for(let p=v*4+10;res.length<n;p-=step)res.splice(1,0,p);

  }

  function make(text){
    const bytes=Array.from(new TextEncoder().encode(String(text)));
    let ecl='M',ver=0;

      for(let v=1;v<=40&&!ver;v++){
        if(4+(v<=9?8:16)+8*bytes.length<=dataWords(v,e)*8){ver=v;ecl=e;}
      }

    }
    if(!ver)throw new Error('النص أطول من سعة رمز QR');
    const bits=[];
    const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1);};
    put(4,4);put(bytes.length,ver<=9?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataWords(ver,ecl)*8;
    put(0,Math.min(4,cap-bits.length));
    put(0,(8-bits.length%8)%8);
    for(let pad=0xEC;bits.length<cap;pad^=0xEC^0x11)put(pad,8);
    const data=[];
    for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}

    const nb=BLK[ecl][ver],el=ECC[ecl][ver],raw=Math.floor(rawModules(ver)/8),ns=nb-raw%nb,sl=Math.floor(raw/nb);
    const div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){
      const dat=data.slice(k,k+sl-el+(i<ns?0:1));k+=dat.length;
      const ecc=rsRem(dat,div);
      if(i<ns)dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all=[];
    for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)all.push(b[i]);});

    const size=ver*4+17,mod=[],fn=[];
    for(let i=0;i<size;i++){mod.push(new Array(size).fill(false));fn.push(new Array(size).fill(false));}
    const setF=(x,y,d)=>{mod[y][x]=!!d;fn[y][x]=true;};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0);}
    const finder=(cx,cy)=>{
      for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
        const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;
        if(x>=0&&x<size&&y>=0&&y<size)setF(x,y,d!==2&&d!==4);
      }
    };
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const ap=alignPos(ver),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){
      if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }

      for(let i=9;i<15;i++)setF(14-i,8,g(i));
      for(let i=0;i<8;i++)setF(size-1-i,8,g(i));
      for(let i=8;i<15;i++)setF(8,size-15+i,g(i));

    };
    drawFormat(0);
    if(ver>=7){
      let rem=ver;
      for(let i=0;i<12;i++)rem=(rem<<1)^((rem>>>11)*0x1F25);
      const v=(ver<<12)|rem;
      for(let i=0;i<18;i++){
        const c=((v>>>i)&1)!==0,a=size-11+i%3,b=Math.floor(i/3);
        setF(a,b,c);setF(b,a,c);
      }
    }

    let bi=0;
    for(let right=size-1;right>=1;right-=2){
      if(right===6)right=5;
      for(let vert=0;vert<size;vert++){
        for(let j=0;j<2;j++){
          const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;
          if(!fn[y][x]&&bi<all.length*8){mod[y][x]=((all[bi>>>3]>>>(7-(bi&7)))&1)!==0;bi++;}
        }
      }
    }

    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!fn[y][x]&&maskFn[m](x,y))mod[y][x]=!mod[y][x];};
    const penalty=()=>{
      let p=0;
      const lines=[];
      for(let y=0;y<size;y++){lines.push(mod[y].map(c=>c?'1':'0').join(''));}
      for(let x=0;x<size;x++){let s='';for(let y=0;y<size;y++)s+=mod[y][x]?'1':'0';lines.push(s);}
      lines.forEach(s=>{
        (s.match(/0{5,}|1{5,}/g)||[]).forEach(r=>{p+=3+r.length-5;});
        p+=40*((s.match(/(?=10111010000)/g)||[]).length+(s.match(/(?=00001011101)/g)||[]).length);
      });
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=mod[y][x];if(c===mod[y][x+1]&&c===mod[y+1][x]&&c===mod[y+1][x+1])p+=3;}

    };

    }

function qrSvg(text){
  const q=QR.make(text),b=4,n=q.size+b*2;
  let d='';
  for(let y=0;y<q.size;y++){
    let x=0;
    while(x<q.size){
      if(q.get(x,y)){const x0=x;while(x<q.size&&q.get(x,y))x++;d+='M'+(x0+b)+' '+(y+b)+'h'+(x-x0)+'v1h-'+(x-x0)+'z';}
      else x++;
    }
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" role="img" aria-label="رمز QR"><rect width="'+n+'" height="'+n+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function qrPng(text,cb){
  const q=QR.make(text),b=4,n=q.size+b*2,sc=Math.max(4,Math.floor(1000/n)),c=document.createElement('canvas');
  c.width=c.height=n*sc;
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#000';
  for(let y=0;y<q.size;y++)for(let x=0;x<q.size;x++)if(q.get(x,y))g.fillRect((x+b)*sc,(y+b)*sc,sc,sc);
  c.toBlob(cb,'image/png');
}

function socialURL(k,raw){
  const s=cstr(normDigits(raw),200).replace(/\s+/g,'');
  if(!s)return '';
  if(k==='wa'&&!/^https?:\/\//i.test(s)){
    let d=s.replace(/\D/g,'');
    if(!/^[\d+\-()]+$/.test(s))return '';
    if(d.slice(0,2)==='00')d=d.slice(2);else if(d.charAt(0)==='0')d='20'+d.slice(1);
    return (d.length>=10&&d.length<=15)?'https://wa.me/'+d:'';
  }
  let u;
  const domainLike=k==='web'?/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i:/^((www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+\/\S*|www\.\S+|(tiktok|facebook|instagram|fb)\.(com|me)(\/\S*)?)$/i;
  if(/^https?:\/\//i.test(s))u=s;
  else if(domainLike.test(s))u='https://'+s;
  else{
    const h=s.replace(/^@/,'').replace(/\/+$/,'');
    const x=SOC.find(o=>o.k===k);
    if(!x||!x.base||!/^[A-Za-z0-9._-]{2,50}$/.test(h))return '';
    u=x.base+h;
  }
  return (u.length<=220&&/^https?:\/\/[A-Za-z0-9.-]+(:\d+)?([\/?#][^\s<>"'\\]*)?$/.test(u))?u:'';
}

function cleanFaults(a,equip){
  const em={};equip.forEach(e=>{em[e.id]=1;});
  const seen={};
  const out=asList(a).filter(f=>em[f.eid]&&cstr(f.title,120)).slice(0,20000).map(f=>{
    const st=FAULT_ST[f.status]?f.status:'open';
    const date=okDate(f.date)?f.date:todayStr();
    const o={id:uniqId(f.id,seen),n:Math.max(0,Math.round(+f.n)||0),eid:f.eid,title:cstr(f.title,120),desc:cstr(f.desc,400),sev:FAULT_SEV[f.sev]?f.sev:'mid',stop:!!f.stop,status:st,date:date,asg:cleanUid(f.asg),hist:[]};
    if(st==='fixed'||st==='closed'){
      const x=(f.fix&&typeof f.fix==='object')?f.fix:{};
      o.fix={d:okDate(x.d)?x.d:date,n:cstr(x.n,400),c:round2(nn(x.c)),u:cleanUid(x.u)};
    }
    if(st==='closed'){
      const x=(f.cl&&typeof f.cl==='object')?f.cl:{};
      o.cl={u:cleanUid(x.u)||'admin',t:+x.t>0?+x.t:0};
    }
    asList(f.hist).slice(-60).forEach(h=>{if(FAULT_EV[h.e])o.hist.push({t:+h.t>0?+h.t:0,u:cleanUid(h.u),e:h.e,n:cstr(h.n,400)});});
    return stampOf(o,f);
  });
  let mx=0;const used={};
  out.forEach(f=>{if(f.n>0&&!used[f.n]){used[f.n]=1;mx=Math.max(mx,f.n);}else f.n=0;});
  out.forEach(f=>{if(!f.n)f.n=++mx;});
  return out;
}

  });
  return out.sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:((+b.at||0)-(+a.at||0))));

function eqStats(e){
  const logs=eqLog(e.id);
  let rep=0,mnt=0,cost=0,lastM='';
  logs.forEach(x=>{
    if(x.kind==='repair')rep++;else mnt++;
    cost+=x.cost||0;
    if(x.kind==='maint'&&x.date>lastM)lastM=x.date;
  });
  const act=state.faults.filter(f=>f.eid===e.id&&(f.status==='open'||f.status==='work'));
  const review=state.faults.filter(f=>f.eid===e.id&&f.status==='fixed').length;
  const base=[e.last0,lastM,(e.at&&!e.last0&&!lastM)?dayKey(e.at):''].filter(Boolean).sort().pop()||'';
  const next=(e.every>0&&base)?shiftDays(base,e.every):'';
  const days=next?dayNum(next)-dayNum(todayStr()):null;
  const warn=opsSet().warnDays;
  const due=days===null?'':(days<0?'red':(days<=warn?'yel':'grn'));
  const state_=act.some(f=>f.stop)?'down':(act.length?'fault':'ok');
  return {rep:rep,mnt:mnt,cost:round2(cost),last:lastM||e.last0||'',next:next,days:days,due:due,health:state_,open:act.length,review:review};
}

function dueTs(l){
  const p=l.date.split('-').map(Number),t=(l.time||'23:59').split(':').map(Number);
  return new Date(p[0],p[1]-1,p[2],t[0]||0,t[1]||0).getTime();
}

function ckState(l,now){
  now=now||nowTs();
  const total=l.items.length,done=l.items.filter(i=>i.d).length;
  let st;
  if(total&&done===total)st='done';
  else{
    const due=dueTs(l);
    if(now>due)st=(l.gen&&l.date<todayStr())?'missed':'late';
    else if(due-now<=(l.warn||120)*60000)st='soon';
    else st='next';
  }
  return {st:st,done:done,total:total,pct:total?Math.round(done/total*100):0,due:dueTs(l)};
}

];
const THEME_MOTION={full:'كاملة',soft:'خفيفة',off:'بدون حركة'};
const THEME_KEYS=['--pri','--pri-d','--pri-l','--pri-b','--pri-ll','--hdr-a','--hdr-b','--bg'];

function cleanRGB(a,d){
  if(!Array.isArray(a)||a.length!==3)return d.slice();
  const r=a.map(x=>{
    const s=normDigits(x).trim(),n=Math.round(+s);
    return (s!==''&&isFinite(n))?Math.max(0,Math.min(255,n)):NaN;
  });
  return r.some(isNaN)?d.slice():r;
}
function cleanTheme(o){
  o=(o&&typeof o==='object')?o:{};
  return {pri:cleanRGB(o.pri,THEME_DEF.pri),hdr:cleanRGB(o.hdr,THEME_DEF.hdr),bg:cleanRGB(o.bg,THEME_DEF.bg),motion:THEME_MOTION[o.motion]?o.motion:THEME_DEF.motion};
}
const thLin=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
const thLum=c=>0.2126*thLin(c[0])+0.7152*thLin(c[1])+0.0722*thLin(c[2]);
const thMix=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
const thHex=c=>'#'+c.map(x=>x.toString(16).padStart(2,'0')).join('');
const thContrastW=c=>1.05/(thLum(c)+0.05);
function thDarken(c,min){
  let r=c.slice(),k=0;
  while(thContrastW(r)<min&&k<60){r=thMix(r,[0,0,0],0.06);k++;}
  return r;
}
function thLighten(c,minLum){
  let r=c.slice(),k=0;
  while(thLum(r)<minLum&&k<40){r=thMix(r,[255,255,255],0.1);k++;}
  return r;
}
function themeEffective(t){
  const hdr=thDarken(t.hdr,4.8);
  return {pri:thDarken(t.pri,5.2),hdr:hdr,hdr2:thDarken(hdr.map(x=>Math.min(255,Math.round(x*1.6))),3.6),bg:thLighten(t.bg,0.78)};
}
function themeVars(t){
  const e=themeEffective(t),W=[255,255,255];
  return {
    '--pri':thHex(e.pri),
    '--pri-d':thHex(thDarken(thMix(e.pri,[0,0,0],0.24),7)),
    '--pri-l':thHex(thMix(e.pri,W,0.9)),
    '--pri-b':thHex(thMix(e.pri,W,0.75)),
    '--pri-ll':thHex(thMix(e.pri,W,0.83)),
    '--hdr-a':thHex(e.hdr),
    '--hdr-b':thHex(e.hdr2),
    '--bg':thHex(e.bg)
  };
}

function themeAdjusted(t){
  const e=themeEffective(t),ne=(a,b)=>a.join()!==b.join();
  return {pri:ne(e.pri,t.pri),hdr:ne(e.hdr,t.hdr),bg:ne(e.bg,t.bg)};
}
const themeIsDefault=t=>['pri','hdr','bg'].every(k=>t[k].join()===THEME_DEF[k].join());
function applyTheme(){
  const t=cleanTheme(state&&state.settings&&state.settings.theme),root=document.documentElement,st=root.style;
  if(themeIsDefault(t))THEME_KEYS.forEach(k=>st.removeProperty(k));
  else{const v=themeVars(t);THEME_KEYS.forEach(k=>st.setProperty(k,v[k]));}
  root.setAttribute('data-motion',t.motion);
}
const motionReduced=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const ENC=new TextEncoder();
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();

function zipStore(files){
  const parts=[],cd=[];let off=0;
  files.forEach(f=>{
    const name=ENC.encode(f.name),data=ENC.encode(f.text),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);

    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  });

  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(4,0,true);end.setUint16(6,0,true);
  end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true);end.setUint32(16,off,true);end.setUint16(20,0,true);

}

function cellXML(ref,c){

  if(c.k==='n')return '<c r="'+ref+'"'+s+'><v>'+(+c.v||0)+'</v></c>';
  if(c.k==='f')return '<c r="'+ref+'"'+s+'><f>'+xe(c.f)+'</f><v>'+(+c.v||0)+'</v></c>';

}

const cv=c=>(c&&typeof c==='object')?(+c.v||0):(+c||0);

function tableSheet(o){
  const n=o.headers.length;
  const rows=[];
  rows.push([{k:'s',v:state.settings.shopName+' — '+o.title,s:6}]);
  rows.push([{k:'s',v:(o.sub?o.sub+'   |   ':'')+'تاريخ التصدير: '+fmtDate(todayStr()),s:0}]);
  rows.push([]);
  rows.push(o.headers.map(h=>({k:'s',v:h,s:1})));
  const first=rows.length+1;
  const built=o.rows.map((r,i)=>typeof r==='function'?r(first+i):r);
  built.forEach(r=>rows.push(r));
  const last=first+built.length-1;
  if(built.length){
    if(o.totalRow)rows.push(o.totalRow(first,last));
    else if(o.sumCols&&o.sumCols.length){
      const tr=[];for(let i=0;i<n;i++)tr.push({k:'b',s:4});
      tr[0]={k:'s',v:'الإجمالي ('+built.length+')',s:4};
      o.sumCols.forEach(ci=>{
        let tot=0;built.forEach(r=>{tot+=cv(r[ci]);});
        tr[ci]={k:'f',f:'SUM('+colL(ci)+first+':'+colL(ci)+last+')',v:round2(tot),s:5};
      });
      rows.push(tr);
    }
  }
  (o.footer||[]).forEach(f=>rows.push([{k:'s',v:f,s:0}]));
  return {name:o.name,widths:o.widths,rows:rows,merges:['A1:'+colL(n-1)+'1'],landscape:!!o.landscape};
}

function attReminder(){
  if(!levelOK('payroll','f')||!modOn('payroll'))return '';
  const today=todayStr(),m=today.slice(0,7),d=+today.slice(8);
  if(ui.remindOff===today)return '';
  const p=state.payroll[m];
  if(p&&p.closed)return '';
  const hs={};prRules().hol.forEach(x=>{hs[x.d]=1;});
  if(hs[today])return '';
  let n=0;
  state.employees.forEach(e=>{
    if(!e.active||e.since>m||dowOf(m,d)===e.off)return;
    const r=p&&(p.rows||[]).find(x=>x.empId===e.id&&isAtt(x));
    if(!r||!r.att[d])n++;
  });
  if(!n)return '';
  return '<div class="banner tip">⏰ تذكير: لم يُسجَّل حضور اليوم لـ <b>'+n+'</b> '+(n===1?'موظف':'موظفين')+'.<button class="btn sec" data-act="goAttendance">تسجيل الحضور الآن</button><button class="btn sec" data-act="hideRemind">إخفاء اليوم</button></div>';
}

function paintRow(tr,p){

}

function empModal(e){
  const edit=!!e;
  if(edit)emp0(e);
  const pay=edit?empPay(e,ui.month):{rate:0,basis:'hour'};
  const accs=[['','حسب حساب الشهر'],['cash','نقدًا']].concat(state.accounts.map(a=>[a.id,a.name+' ('+(a.type==='bank'?'بنك':'محفظة')+')']));
  openModal({title:edit?'تعديل موظف':'موظف جديد',
    text:edit?'عند تغيير الأجر أو أساسه اختر الشهر الذي يسري منه.':'سجّل الأجر مرة واحدة، ويُحتسب راتب كل شهر تلقائيًا من الحضور.',
    okLabel:edit?'حفظ':'إضافة',
    fields:[
      {name:'name',label:'اسم الموظف',plain:true,maxlength:60,value:edit?e.name:''},
      {name:'job',label:'الوظيفة (اختياري)',plain:true,maxlength:40,value:edit?e.job:''},
      {name:'basis',label:'أساس الأجر',options:Object.keys(PAY_BASIS).map(k=>[k,PAY_BASIS[k]]),value:pay.basis},
      {name:'rate',label:'قيمة الأجر ('+CUR+') حسب الأساس المختار',inputmode:'decimal',maxlength:10,value:edit?String(pay.rate):''},
      {name:'hpd',label:'ساعات اليوم العادية',inputmode:'decimal',maxlength:5,value:edit?String(e.hpd):'8'},
      {name:'off',label:'يوم الراحة الأسبوعية',options:[['-1','لا يوجد'],['5','الجمعة'],['6','السبت'],['0','الأحد'],['1','الاثنين'],['2','الثلاثاء'],['3','الأربعاء'],['4','الخميس']],value:edit?String(e.off):'5'},
      {name:'restPaid',label:'الراحة الأسبوعية بأجر (لمن أجره بالساعة أو باليوم)',options:[['0','لا'],['1','نعم']],value:edit&&e.restPaid?'1':'0'},
      edit?{name:'from',label:'تغيير الأجر يسري من شهر',type:'month',maxlength:7,value:ui.month}
          :{name:'since',label:'بدأ العمل من شهر',type:'month',maxlength:7,value:ui.month},
      {name:'ot',label:'معامل أجر الساعة الإضافية (1 = بنفس السعر، 1.5 = ونصف)',inputmode:'decimal',maxlength:5,value:edit?String(e.ot):'1'},
      {name:'absMult',label:'معامل خصم يوم الغياب (1 = بقيمة اليوم، 2 = ضعف اليوم)',inputmode:'decimal',maxlength:5,value:edit?String(e.absMult):'1'},
      {name:'lateMult',label:'معامل خصم التأخير (0 = دون خصم، 1 = بقيمة الوقت)',inputmode:'decimal',maxlength:5,value:edit?String(e.lateMult):'1'},
      {name:'ins',label:'نسبة التأمينات (%)',inputmode:'decimal',maxlength:5,value:edit?String(e.ins):'0'},
      {name:'tax',label:'نسبة ضريبة الدخل (%)',inputmode:'decimal',maxlength:5,value:edit?String(e.tax):'0'},
      {name:'payAcc',label:'طريقة صرف الراتب',options:accs,value:edit?(e.payAcc||''):''}
    ],
    onSubmit:async v=>{
      const name=(v.name||'').replace(/\s+/g,' ').trim();
      if(!name)return 'أدخل اسم الموظف';
      const num=(x,d)=>String(x==null?'':x).trim()===''?d:parseNum(x);
      const rate=parseNum(v.rate),hpd=parseNum(v.hpd);
      if(!(rate>=0)||String(v.rate).trim()==='')return 'أدخل قيمة الأجر';
      if(!(hpd>0&&hpd<=24))return 'يجب أن تكون ساعات اليوم بين 1 و 24';
      const ot=num(v.ot,1),absMult=num(v.absMult,1),lateMult=num(v.lateMult,1),ins=num(v.ins,0),tax=num(v.tax,0);
      if(!(ot>=0&&ot<=10)||!(absMult>=0&&absMult<=10)||!(lateMult>=0&&lateMult<=10))return 'المعاملات يجب أن تكون بين 0 و 10';
      if(!(ins>=0&&ins<=100)||!(tax>=0&&tax<=100))return 'النسب يجب أن تكون بين 0 و 100';
      const basis=PAY_BASIS[v.basis]?v.basis:'hour';
      const off=+v.off,restPaid=v.restPaid==='1';
      const payAcc=(v.payAcc==='cash'||(v.payAcc&&getAcc(v.payAcc)))?v.payAcc:'';
      if(state.employees.some(x=>x.name===name&&(!edit||x.id!==e.id)))return 'يوجد موظف بنفس الاسم';
      if(!edit){
        const since=MKEY.test(v.since)?v.since:ui.month;
        state.employees.push({id:uid(),name:name,job:(v.job||'').trim(),hpd:hpd,off:off,active:true,since:since,rates:[{from:since,rate:round2(rate),basis:basis}],
          ot:ot,absMult:absMult,lateMult:lateMult,restPaid:restPaid,ins:ins,tax:tax,payAcc:payAcc});
        ui.prView='emp';
      }else{
        const from=MKEY.test(v.from)?v.from:ui.month;
        e.name=name;e.job=(v.job||'').trim();e.hpd=hpd;e.off=off;
        e.ot=ot;e.absMult=absMult;e.lateMult=lateMult;e.restPaid=restPaid;e.ins=ins;e.tax=tax;e.payAcc=payAcc;
        const cur=empPay(e,from);
        if(round2(rate)!==cur.rate||basis!==cur.basis){
          const ex=e.rates.find(x=>x.from===from);
          if(ex){ex.rate=round2(rate);ex.basis=basis;}else e.rates.push({from:from,rate:round2(rate),basis:basis});
          e.rates.sort((a,b)=>a.from<b.from?-1:(a.from>b.from?1:0));
        }
        Object.keys(state.payroll).forEach(k=>{const p=state.payroll[k];if(p.closed)return;p.rows.forEach(r=>{if(r.empId===e.id)r.name=e.name;});});
      }
      ensureMonthRows(ui.month);
      save();render();toast(edit?'تم حفظ التعديل':'تمت إضافة الموظف');return null;
    }});
}

function slipHTML(r,p){
  const s=state.settings,c=calcRow(r,p),eff=c.eff;
  const name=(r.name||'').trim()||'بدون اسم';
  const sub=[s.address,s.phone].filter(Boolean).join(' — ');
  const money=(v,signed)=>numSpan(v,'',signed)+' '+CUR;
  const rows=[];
  if(c.att){
    rows.push(['أساس الأجر',PAY_BASIS[c.basis]+' — '+money(c.rate)]);
    rows.push(['أيام الحضور',numSpan(c.st.present)+' يوم']);
    if(c.st.leave)rows.push(['إجازات بأجر',numSpan(c.st.leave)+' يوم']);
    if(c.st.holiday)rows.push(['عطل رسمية',numSpan(c.st.holiday)+' يوم']);
    rows.push(['أيام الغياب',numSpan(c.st.absent)+' يوم']);
    rows.push(['إجمالي الساعات',numSpan(c.hours)+' ساعة'+(c.otH?' (منها '+numSpan(c.otH)+' إضافي)':'')]);
    rows.push(['الأجر الأساسي',money(c.base)]);
    if(c.otAmt)rows.push(['الإضافي',money(c.otAmt)]);
    if(c.holExtra)rows.push(['علاوة العمل في العطل',money(c.holExtra)]);
    if(c.absLoss)rows.push(['خصم أيام الغياب',money(c.absLoss)]);
    rows.push(['إجمالي الأجر',money(c.gross)]);
    if(c.bonus)rows.push(['مكافأة / حافز',money(c.bonus)]);
    if(c.penItems)rows.push(['خصومات / جزاءات',money(c.penItems)]);
    if(c.late)rows.push(['خصم التأخير ('+fmt(c.st.lateMin)+' دقيقة)',money(c.late)]);
    if(c.absPen)rows.push(['جزاء الغياب',money(c.absPen)]);
    if(c.ins)rows.push(['التأمينات',money(c.ins)]);
    if(c.tax)rows.push(['ضريبة الدخل',money(c.tax)]);
  }else{
    rows.push(['عدد الساعات',numSpan(c.hours)+' ساعة']);
    rows.push(['سعر الساعة',money(c.rate)]);
    rows.push(['إجمالي الأجر (الساعات × السعر)',money(c.gross)]);
    if(c.off>0){
      if(p.dayOffMode==='none')rows.push(['أيام العطلة (للعلم فقط)',numSpan(c.off)+' يوم']);
      else{
        rows.push(['أيام العطلة',numSpan(c.off)+' يوم × '+numSpan(c.hpd)+' ساعات']);
        rows.push([p.dayOffMode==='deduct'?'خصم أيام العطلة':'إضافة أيام العطلة',money(Math.abs(eff))]);
      }
    }
  }
  rows.push(['السلف المخصومة',money(c.adv)]);
  if(c.att&&c.advCarryOut)rows.push(['سلف مرحَّلة إلى الشهر التالي',money(c.advCarryOut)]);
  const net=c.net;
  return '<div class="slip">'+
    '<div class="slip-head">'+(s.logo?'<img src="'+esc(s.logo)+'" alt="">':'')+
      '<div class="slip-brand"><b>'+esc(s.shopName)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+
      '<div class="slip-title">قسيمة راتب<small>شهر '+esc(monthLabel(p.m||ui.month))+'</small></div></div>'+
    '<div class="slip-emp">اسم الموظف: <b>'+esc(name)+'</b></div>'+
    '<table>'+rows.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('')+'</table>'+
    '<div class="slip-net"><span>صافي الراتب</span><span>'+money(net)+'</span></div>'+
    (net>0?'<div class="slip-words">'+esc(tafqeet(net))+'</div>':(net<0?'<div class="slip-words">السلف أكبر من المستحق — المتبقي على الموظف: '+fmt(-net)+' '+CUR+'</div>':''))+
    '<div class="slip-sign"><span>توقيع الموظف</span><span>توقيع المسؤول</span></div>'+
    '<div class="slip-foot">تاريخ الطباعة: '+fmtDate(todayStr())+'</div>'+
  '</div>';
}
function printSlips(ids){
  const p=payrollFor(ui.month,false);
  if(!p||!p.rows.length){toast('لا يوجد موظفين للطباعة');return;}
  const rows=p.rows.filter(r=>ids?ids.indexOf(r.id)>-1:rowData(r));
  if(!rows.length){toast('لا يوجد موظفين للطباعة');return;}
  $('#slips').innerHTML=rows.map(r=>slipHTML(r,p)).join('');

  doPrint('portrait');
}

function filterList(arr,view,kind){
  const y=kind?ui[kind+'Year']:'',mo=kind?ui[kind+'Mon']:'';
  return arr.map((x,i)=>({x:x,i:i})).filter(o=>{
    const d=o.x.date||'';
    if(view!=='all')return d.startsWith(ui.month);
    if(y&&d.slice(0,4)!==y)return false;
    if(mo&&d.slice(5,7)!==mo)return false;
    return true;
  }).sort((a,b)=>(b.x.date||'').localeCompare(a.x.date||'')||b.i-a.i).map(o=>o.x);
}
const expList=()=>filterList(state.expenses,ui.expView,'exp');
const revList=()=>filterList(state.revenues,ui.revView,'rev');

  const view=ui[kind+'View'],cy=String(new Date().getFullYear()),opts=[];

function docRecalc(f){
  if(!f||!f.dataset||!f.dataset.dk)return;
  let sub=0;
  $$('.doc-line',f).forEach(r=>{
    const q=parseNum(r.querySelector('[name=l_q]').value),c=parseNum(r.querySelector('[name=l_c]').value),v=round2(q*c);
    r.querySelector('.l-tot').textContent=fmt(v);sub+=v;
  });
  sub=round2(sub);
  const g=n=>f.elements[n]?parseNum(f.elements[n].value):0;
  const disc=Math.min(sub,Math.max(0,g('disc'))),extra=f.dataset.dk==='p'?Math.max(0,g('extra')):0;
  const total=round2(sub-disc+extra),paid=Math.max(0,g('amount'));
  const set=(n,v)=>{const e=$('[data-sum="'+n+'"]',f);if(e)e.textContent=fmt(v);};
  set('sub',sub);set('total',total);set('rest',Math.max(0,round2(total-paid)));
  f.dataset.total=String(total);
}

function profitMonths(){

  [state.revenues,state.expenses,state.sales,state.stockAdj].forEach(l=>l.forEach(x=>{if(x.date)set[x.date.slice(0,7)]=1;}));
  state.txns.concat(state.transfers,state.vouchers,state.purchases).forEach(x=>{if(x.date&&x.comm)set[x.date.slice(0,7)]=1;});

function profitBreakdown(docs){
  const C=stockCalc().cogs,prods={},custs={};
  docs.forEach(d=>{
    const t=docTotals(d),pcode=d.partyId||'';
    const c=custs[pcode]||(custs[pcode]={n:0,sal:0,cost:0});
    c.n++;
    d.lines.forEach((l,i)=>{
      const v=round2(l.qty*l.price),rev=t.sub>0?v-t.disc*v/t.sub:v,cost=C[d.id+':'+i]||0;
      const o=prods[l.pid]||(prods[l.pid]={qty:0,rev:0,cost:0});
      o.qty+=l.qty;o.rev+=rev;o.cost+=cost;
      c.sal+=rev;c.cost+=cost;
    });
  });
  return {prods:prods,custs:custs};
}
function profitData(){

  Object.keys(T).forEach(f=>{T[f]=round2(T[f]);});

}

const TRIAL_KEY='dive_trial_v1';
const TRIAL_MS=TRIAL_DAYS*DAY_MS;
let trialExpired=false,trialStorageBad=false;
function trialReadLS(){try{const o=JSON.parse(localStorage.getItem(TRIAL_KEY)||'null');return(o&&typeof o==='object')?o:null;}catch(e){return null;}}
function trialWriteLS(o){try{localStorage.setItem(TRIAL_KEY,JSON.stringify(o));return true;}catch(e){return false;}}
function trialInfo(){
  const now=Date.now(),a=trialReadLS(),b=state.trial;
  const starts=[a&&+a.start,b&&+b.start].filter(x=>x>0);
  const seens=[a&&+a.seen,b&&+b.seen].filter(x=>x>0);
  const start=starts.length?Math.min.apply(null,starts):now;
  const seen=Math.max.apply(null,[now].concat(seens));
  return {start:start,seen:seen,left:start+TRIAL_MS-seen};
}
function dayWord(n){return n===1?'يوم':(n===2?'يومين':(n<=10?n+' أيام':n+' يوم'));}
function hourWord(n){return n===1?'ساعة':(n===2?'ساعتين':(n<=10?n+' ساعات':n+' ساعة'));}
function trialLeftText(ms){
  const h=Math.max(1,Math.ceil(ms/3600000)),d=Math.floor(h/24),r=h%24;
  return d>0?dayWord(d)+(r?' و'+hourWord(r):''):hourWord(r);
}

function trialTick(){
  if(!TRIAL_DAYS)return false;
  if(trialExpired)return true;
  if(LIC_ON){
    const L=licTick();
    if(L.mode==='life'||L.mode==='active')return false;
    if(L.mode==='expired'){showTrialEnd(L);return true;}
  }
  const t=trialInfo(),prev=trialReadLS();
  const rec={start:t.start,seen:t.seen};
  if(!prev||+prev.start!==rec.start||(rec.seen-(+prev.seen||0))>20000){
    if(!trialWriteLS(rec))trialStorageBad=true;
    state.trial=rec;
    try{localStorage.removeItem(STORE_KEY);}catch(e){}
  }
  if(trialStorageBad||t.left<=0){showTrialEnd(null);return true;}
  return false;
}

  });
  setInterval(()=>{if(trialExpired)return;if(!trialTick()&&!locked)renderAlerts();},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!trialExpired)trialTick();});
}

const LIC_DAY=86400000;
const LIC_AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const LIC_RE=/^[A-HJ-NP-Z2-9]+$/;
const LIC_SK=new Int32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function licUtf8(s){return new TextEncoder().encode(String(s));}
function licHex(b){let o='';for(let i=0;i<b.length;i++)o+=(b[i]+256).toString(16).slice(1);return o;}
function licSha256(msg){
  const l=msg.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);
  m.set(msg);m[l]=0x80;
  const dv=new DataView(m.buffer),bits=l*8;
  dv.setUint32(n-8,Math.floor(bits/4294967296));dv.setUint32(n-4,bits>>>0);
  let h0=0x6a09e667|0,h1=0xbb67ae85|0,h2=0x3c6ef372|0,h3=0xa54ff53a|0,h4=0x510e527f|0,h5=0x9b05688c|0,h6=0x1f83d9ab|0,h7=0x5be0cd19|0;
  const w=new Int32Array(64);
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){
      const x=w[i-15],y=w[i-2];
      const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
      const s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      const t1=(h+S1+((e&f)^(~e&g))+LIC_SK[i]+w[i])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      const t2=(S0+((a&b)^(a&c)^(b&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;h5=(h5+f)|0;h6=(h6+g)|0;h7=(h7+h)|0;
  }
  const out=new Uint8Array(32),ov=new DataView(out.buffer);
  [h0,h1,h2,h3,h4,h5,h6,h7].forEach((v,i)=>ov.setInt32(i*4,v));
  return out;
}
function licHmac(key,msg){
  if(key.length>64)key=licSha256(key);
  const ip=new Uint8Array(64+msg.length),op=new Uint8Array(96);
  for(let i=0;i<64;i++){const k=i<key.length?key[i]:0;ip[i]=k^0x36;op[i]=k^0x5c;}
  ip.set(msg,64);op.set(licSha256(ip),64);
  return licSha256(op);
}

function licB32(b){
  let bits=0,v=0,o='';
  for(let i=0;i<b.length;i++){
    v=((v<<8)|b[i])&0xfffff;bits+=8;
    while(bits>=5){o+=LIC_AL[(v>>>(bits-5))&31];bits-=5;}
  }
  if(bits>0)o+=LIC_AL[(v<<(5-bits))&31];
  return o;
}
function licUnb32(s){
  const out=[];let bits=0,v=0;
  for(let i=0;i<s.length;i++){
    const x=LIC_AL.indexOf(s[i]);if(x<0)return null;
    v=((v<<5)|x)&0xfffff;bits+=5;
    if(bits>=8){out.push((v>>>(bits-8))&255);bits-=8;}
  }
  return new Uint8Array(out);
}
function licFmt(s){return String(s||'').replace(/(.{4})(?=.)/g,'$1-');}
function licNormCode(s){
  s=String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  return s.toUpperCase().replace(/[\s\-_.​-‏‪-‮⁦-⁩﻿]/g,'');
}
function licIidOK(s){return typeof s==='string'&&s.length===8&&LIC_RE.test(s);}
function licNewIid(){
  const b=new Uint8Array(5);
  try{crypto.getRandomValues(b);}catch(e){for(let i=0;i<5;i++)b[i]=Math.floor(Math.random()*256);}
  return licB32(b);
}

function licKeys(k){return {c:licHmac(k,licUtf8('code')),r:licHmac(k,licUtf8('record'))};}

function licDayNo(ms){return Math.floor((ms-Date.UTC(2025,0,1))/LIC_DAY);}

function licAddUnits(base,unit,count){
  const d=new Date(base);
  if(unit===0)d.setDate(d.getDate()+count);
  else{
    const day=d.getDate();
    d.setDate(1);d.setMonth(d.getMonth()+(unit===1?count:count*12));
    d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
  }
  d.setHours(23,59,59,999);
  return d.getTime();
}
function licDurText(unit,n){
  if(unit===3)return 'مدى الحياة';
  const f=(one,two,few,many)=>n===1?one:(n===2?two:(n<=10?n+' '+few:n+' '+many));
  if(unit===0)return f('يوم واحد','يومان','أيام','يومًا');
  if(unit===1)return f('شهر واحد','شهران','أشهر','شهرًا');
  return f('سنة واحدة','سنتان','سنوات','سنة');
}

function licMakeCode(keys,o){
  const bound=!!o.iid,pl=bound?14:9,b=new Uint8Array(pl+6);
  const u16=((o.unit&3)<<14)|(o.unit===3?0:(o.count&16383));
  b[0]=0x10|(bound?1:0);b[1]=u16>>8;b[2]=u16&255;
  b[3]=(o.serial>>16)&255;b[4]=(o.serial>>8)&255;b[5]=o.serial&255;
  b[6]=(o.issue>>8)&255;b[7]=o.issue&255;b[8]=o.win&255;
  if(bound)b.set(licUnb32(o.iid),9);
  b.set(licHmac(keys.c,b.subarray(0,pl)).subarray(0,6),pl);
  return licFmt(licB32(b));
}

function licParseCode(keys,raw){
  const s=licNormCode(raw);
  if(!s||!LIC_RE.test(s))return {ok:false,err:'chars'};
  if(s.length!==24&&s.length!==32)return {ok:false,err:'fmt'};
  const b=licUnb32(s),pl=b.length-6;
  const mac=licHmac(keys.c,b.subarray(0,pl));
  let d=0;for(let i=0;i<6;i++)d|=mac[i]^b[pl+i];
  if(d!==0||(b[0]>>4)!==1)return {ok:false,err:'mac'};
  const bound=b[0]&1,u16=(b[1]<<8)|b[2],unit=u16>>14,count=u16&16383;
  if(bound!==(pl===14?1:0)||(unit<3&&count<1))return {ok:false,err:'mac'};
  return {ok:true,unit:unit,count:unit===3?0:count,serial:(b[3]<<16)|(b[4]<<8)|b[5],issue:(b[6]<<8)|b[7],win:b[8],bound:!!bound,iid:bound?licB32(b.subarray(9,14)):''};
}

function licRecMac(keys,r){
  const s=['L1',r.i,r.s,r.e,r.l?1:0,r.b?1:0,r.n,r.k,(r.u||[]).join('.')].join('|');
  return licHex(licHmac(keys.r,licUtf8(s))).slice(0,20);
}

const LIC_LS='dive_lic_v1';
const LIC_ON=!!(TRIAL_DAYS&&LIC_KEY);
const LIC_WARN=10;
const LIC_MSG={

let licKC=null,licSeenMem=0,licFails=0,licBlock=0;
function licK(){
  if(!licKC){
    const a=LIC_KEY[0],b=LIC_KEY[1],k=new Uint8Array(a.length);
    for(let i=0;i<a.length;i++)k[i]=a[i]^b[i];
    licKC=licKeys(k);
  }
  return licKC;
}
function licBlank(iid){return {i:iid,s:0,e:0,l:0,b:0,n:0,k:0,u:[]};}
function licSign(r){r.m=licRecMac(licK(),r);return r;}
function licValid(r){
  try{return !!(r&&typeof r==='object'&&licIidOK(r.i)&&Array.isArray(r.u)&&typeof r.m==='string'&&r.m===licRecMac(licK(),r));}
  catch(e){return false;}
}
function licReadLS(){try{const o=JSON.parse(localStorage.getItem(LIC_LS)||'null');return(o&&typeof o==='object')?o:null;}catch(e){return null;}}

function licMerge(recs){
  const o=licBlank(recs[0].i),seen={};
  recs.forEach(r=>{
    const s=+r.s||0;if(s&&(!o.s||s<o.s))o.s=s;
    o.e=Math.max(o.e,+r.e||0);o.l=o.l||(r.l?1:0);o.b=o.b||(r.b?1:0);
    o.n=Math.max(o.n,+r.n||0);o.k=Math.max(o.k,+r.k||0);
    r.u.forEach(x=>{if(!seen[x]){seen[x]=1;o.u.push(x);}});
  });
  o.u=o.u.slice(-60);
  return o;
}
function licSig(r){return [r.i,r.e,r.l?1:0,r.b?1:0,r.n,(r.u||[]).join('.')].join('|');}

function licCurrent(){
  const shared=state&&state.settings&&state.settings.cloudLicense;
  if(licValid(shared)&&shared.n&&!shared.b)return {iid:shared.i,rec:JSON.parse(JSON.stringify(shared))};
  const a=licReadLS(),b=(state&&state.lic)||null;
  const va=licValid(a)?a:null,vb=licValid(b)?b:null;
  let iid=null;
  if(a&&licIidOK(a.i))iid=a.i;
  else if(vb&&!vb.b)iid=vb.i;
  const recs=[va,vb].filter(r=>r&&r.i===iid);
  return {iid:iid,rec:recs.length?licMerge(recs):null};
}

function licStatus(){
  licSeenMem=Math.max(licSeenMem,Date.now());
  const c=licCurrent(),r=c.rec,out={mode:'none',iid:c.iid||'',rec:r};
  if(r)licSeenMem=Math.max(licSeenMem,+r.k||0);
  if(!r||!r.n)return out;
  if(r.l){out.mode='life';return out;}
  const now=licSeenMem;
  out.exp=+r.e;out.left=out.exp-now;out.mode=out.left>0?'active':'expired';
  return out;
}
function licPersist(r){

function licTick(){
  licSeenMem=Math.max(licSeenMem,Date.now());

  let r=c.rec,iid=c.iid,need=false;
  if(!iid){iid=licNewIid();need=true;}
  if(!r){r=licBlank(iid);need=true;}
  const a=licReadLS(),b=state.lic,sg=licSig(r);
  if(!(licValid(a)&&a.i===iid&&licSig(a)===sg))need=true;
  if(!(licValid(b)&&b.i===iid&&licSig(b)===sg))need=true;
  const nk=Math.max(+r.k||0,licSeenMem);
  if(nk-(+r.k||0)>600000){r.k=nk;need=true;}
  if(need)licPersist(r);
  return licStatus();
}

function licCalLeft(exp){
  const a=new Date(Math.max(Date.now(),licSeenMem)),b=new Date(exp);
  return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/LIC_DAY);

function licActivate(raw){
  const now=Date.now();
  if(now<licBlock)return {ok:false,err:LIC_MSG.many};
  const fail=e=>{licFails++;if(licFails>=6){licFails=0;licBlock=now+30000;}return {ok:false,err:e};};
  const p=licParseCode(licK(),raw);
  if(!p.ok)return fail(LIC_MSG[p.err]||LIC_MSG.mac);
  const c=licCurrent(),iid=c.iid||licNewIid();
  if(p.bound&&p.iid!==iid)return fail(LIC_MSG.bound);
  const dn=licDayNo(now);
  if(dn<p.issue-1)return {ok:false,err:LIC_MSG.clock};
  if(p.win>0&&dn>p.issue+p.win)return {ok:false,err:LIC_MSG.window};
  const r=c.rec||licBlank(iid);
  if(r.u.indexOf(p.serial)>-1)return {ok:false,err:LIC_MSG.used};
  const seenNow=Math.max(now,licSeenMem,+r.k||0);
  const renew=!!(r.n&&!r.l&&+r.e>seenNow);
  if(p.unit===3){r.l=1;r.e=0;}
  else{
    if(r.l)return {ok:false,err:LIC_MSG.life};
    r.e=licAddUnits(Math.max(seenNow,+r.e||0),p.unit,p.count);
  }
  if(!r.s)r.s=now;
  r.n=(+r.n||0)+1;r.u.push(p.serial);if(r.u.length>60)r.u=r.u.slice(-60);
  if(p.bound)r.b=1;
  r.k=Math.max(+r.k||0,seenNow);r.i=iid;
  if(!licPersist(r))return {ok:false,err:LIC_MSG.store};
  save();
  licFails=0;
  const dur=licDurText(p.unit,p.count);
  return {ok:true,msg:p.unit===3
    ?'تم التفعيل بنجاح. الترخيص دائم (مدى الحياة).'
    :(renew?'تم التجديد بنجاح. أُضيفت المدة ('+dur+') إلى المتبقي من الترخيص، وينتهي الآن بتاريخ '+licDate(r.e)+'.'
           :'تم التفعيل بنجاح. مدة الترخيص: '+dur+'، وينتهي بتاريخ '+licDate(r.e)+'.')};
}

  catch(e){return Math.random().toString(36).slice(2)+Date.now().toString(36);}

async function hashPin(pin,salt){
  try{
    if(window.crypto&&crypto.subtle){
      const key=await crypto.subtle.importKey('raw',ENC.encode(pin),'PBKDF2',false,['deriveBits']);
      const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:ENC.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
      return 'p1:'+hex(bits);
    }
  }catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;const s=salt+':'+pin;
  for(let r=0;r<2000;r++)for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'w1:'+(h2>>>0).toString(16)+(h1>>>0).toString(16);
}

const TAP={key:'',t:0,prev:'',prevH:null};
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y);}
function hoursPrompt(r,d){
  const cur=r.hrs[d];
  const v=prompt('ساعات يوم '+d+' للموظف "'+r.name+'" (اتركها فارغة = ساعات الدوام العادية):',cur!=null?String(cur):'');
  if(v===null)return false;
  const t=normDigits(v).trim();
  if(t===''){r.att[d]='p';delete r.hrs[d];}
  else{const h=parseNum(t);if(!(h>=0&&h<=24)){toast('أدخل ساعات صحيحة (من 0 إلى 24)');return false;}r.att[d]='p';r.hrs[d]=round2(h);}
  save();return true;
}

function cellTap(r,d,after){
  const key=r.id+':'+d,now=Date.now();
  if(TAP.key===key&&now-TAP.t<420){
    TAP.key='';
    setAtt(r,d,TAP.prev);if(TAP.prevH!=null&&TAP.prev==='p')r.hrs[d]=TAP.prevH;
    hoursPrompt(r,d);after();return;
  }
  TAP.key=key;TAP.t=now;TAP.prev=r.att[d]||'';TAP.prevH=r.hrs[d]==null?null:r.hrs[d];
  setAtt(r,d,ATT_NEXT[TAP.prev]);
  save();after();
}
function payrollClick(e){
  if(ui.tab!=='payroll')return false;
  const t=e.target;
  const pv=t.closest('[data-prview]');
  if(pv){ui.prView=pv.dataset.prview;renderPayroll();window.scrollTo(0,0);return true;}
  if(!levelOK('payroll','f'))return false;
  const p=payrollFor(ui.month,false);if(!p)return false;
  const cell=t.closest('td.att-c'),cd=t.closest('.cal .cd[data-d]'),sa=t.closest('[data-setatt]');
  if(!(cell||cd||sa))return false;
  if(p.closed){toast('الشهر مقفل — أعد فتحه أولًا إذا أردت التعديل');return true;}
  if(cell){
    const r=p.rows.find(x=>x.id===cell.closest('tr').dataset.id);if(!r)return true;
    cellTap(r,+cell.dataset.d,()=>repaintAtt(p));return true;
  }
  if(cd){
    const r=p.rows.find(x=>x.id===ui.prRow);if(!r)return true;
    cellTap(r,+cd.dataset.d,()=>keepScroll(renderPayroll));return true;
  }
  if(sa){
    const r=p.rows.find(x=>x.id===sa.closest('.day-row').dataset.id);if(!r)return true;
    const d=+attDayFor().slice(8),code=sa.dataset.setatt;
    setAtt(r,d,r.att[d]===code?'':code);save();repaintAtt(p);return true;
  }
  return false;
}
document.addEventListener('contextmenu',e=>{
  if(ui.tab!=='payroll'||!levelOK('payroll','f'))return;
  const cell=e.target.closest('td.att-c'),cd=e.target.closest('.cal .cd[data-d]');
  if(!cell&&!cd)return;
  e.preventDefault();
  const p=payrollFor(ui.month,false);if(!p||p.closed)return;
  if(cell){const r=p.rows.find(x=>x.id===cell.closest('tr').dataset.id);if(r&&hoursPrompt(r,+cell.dataset.d))repaintAtt(p);}
  else{const r=p.rows.find(x=>x.id===ui.prRow);if(r&&hoursPrompt(r,+cd.dataset.d))keepScroll(renderPayroll);}
});
document.addEventListener('click',e=>{
  const mc=e.target.closest('[data-modal="cancel"]');
  if(mc){closeModal();return;}
  if(e.target.id==='modal'){closeModal();return;}
  const tb=e.target.closest('[data-tab]');
  if(tb){if(!tabAllowed(tb.dataset.tab))return;ui.tab=tb.dataset.tab;ui.editExp=null;ui.editRev=null;ui.editTxn=null;tradeReset();opsReset();render();window.scrollTo(0,0);return;}
  if(payrollClick(e))return;
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  if(!actAllowed(b.dataset.act))return;
  const fn=act[b.dataset.act];
  if(fn){e.preventDefault();fn(b);}
});
document.addEventListener('submit',e=>{

  if(!f)return;
  e.preventDefault();
  if(!reqOK(FORM_REQ[f.dataset.form]))return;

document.addEventListener('change',e=>{
  const t=e.target;
  commEvent(t);
  if(t.id==='selMonth'||t.id==='selYear'){ui.month=$('#selYear').value+'-'+$('#selMonth').value;ui.lastExpDate=null;ui.lastRevDate=null;render();return;}
  if(t.dataset&&t.dataset.cats){
    if(!isAdm())return;
    const key=t.dataset.cats==='rev'?'revCats':'expCats',seen={},arr=[];
    t.value.split(/\n/).forEach(x=>{x=x.replace(/\s+/g,' ').trim().slice(0,40);if(x&&!seen[x]&&arr.length<40){seen[x]=1;arr.push(x);}});
    state.settings[key]=arr.length?arr:null;
    save();renderSettings();toast('تم حفظ البنود');return;
  }
  if(t.dataset&&t.dataset.soc){
    if(!isAdm())return;
    const k=t.dataset.soc,sc=state.settings.social||(state.settings.social={});
    if(k==='qr')sc.qr=t.value==='text'?'text':'vcard';
    else if(k==='inv')sc.inv=!!t.checked;
    else{
      const v=cstr(normDigits(t.value),200).replace(/\s+/g,'');
      if(v&&!socialURL(k,v)){toast('تعذّر التعرّف على هذا الرابط. اكتب اسم الحساب بحروف لاتينية أو الصق الرابط الكامل');t.value=sc[k]||'';return;}
      sc[k]=v;t.value=v;
    }
    state.settings.social=cleanSocial(sc);save();paintSocial();return;
  }
  if(t.dataset&&t.dataset.set){
    if(!isAdm())return;
    const k=t.dataset.set;
    if(k==='autoLock')state.settings.autoLock=+t.value;
    else{state.settings[k]=t.value.trim();if(k==='shopName'&&!state.settings.shopName)state.settings.shopName=DEFAULT_SHOP;}
    save();renderChrome();renderAlerts();resetIdle();return;
  }
  if(t.dataset&&(t.dataset.lbl||t.dataset.mod||t.dataset.sheetname)){
    if(!isAdm())return;
    if(t.dataset.lbl){
      const k=t.dataset.lbl;if(!(k in DEFAULT_LABELS))return;
      const v=t.value.replace(/\s+/g,' ').trim().slice(0,40);
      if(!v||v===DEFAULT_LABELS[k])delete state.settings.labels[k];else state.settings.labels[k]=v;
      save();t.value=L(k);renderNav();toast('تم حفظ التسمية');
    }else if(t.dataset.mod){
      const id=t.dataset.mod;
      if(MODS.some(m=>m.id===id&&m.core))return;
      if(allModIds().indexOf(id)<0)return;
      if(isOffMod(id)){if(t.checked)state.settings.mods[id]=true;else delete state.settings.mods[id];}
      else if(t.checked)delete state.settings.mods[id];else state.settings.mods[id]=false;
      save();renderNav();
    }else{
      const s=sheetOf(t.dataset.sheetname);if(!s)return;
      const v=t.value.replace(/\s+/g,' ').trim().slice(0,30);
      if(v)s.name=v;t.value=s.name;save();renderNav();toast('تم حفظ التسمية');
    }
    return;
  }
  if(t.dataset&&t.dataset.period){
    const k=t.dataset.period,v=t.value;
    if(k!=='exp'&&k!=='rev'&&k!=='pur'&&k!=='sal'&&k!=='prf')return;
    if(v==='all')ui[k+'View']='all';
    else{ui[k+'View']='cur';ui.month=v.slice(2);ui.lastExpDate=null;ui.lastRevDate=null;syncMonthPicker();}
    render();return;
  }
  if(t.dataset&&t.dataset.pr){
    if(!levelOK('payroll','f'))return;
    const R=prRules(),k=t.dataset.pr;
    if(k==='div')R.div=+t.value;
    else if(k==='holPaid')R.holPaid=t.value==='1';
    else if(k==='holMult')R.holMult=parseNum(t.value);
    else if(k==='hol'){
      const seen={},arr=[];
      t.value.split(/\n/).forEach(line=>{
        const mm=normDigits(line).trim().match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/);
        if(mm&&!seen[mm[1]]&&arr.length<60){seen[mm[1]]=1;arr.push({d:mm[1],n:mm[2].replace(/\s+/g,' ').trim().slice(0,40)});}
      });
      arr.sort((a,b)=>a.d<b.d?-1:1);R.hol=arr;
    }else return;
    state.settings.pr=cleanPr(R);
    save();renderPayroll();toast('تم حفظ قواعد الرواتب');return;
  }
  if(t.dataset&&t.dataset.led){
    if(t.dataset.led==='emp')ui.ledEmp=t.value;else ui.ledYear=t.value;
    renderPayroll();return;
  }
  if(t.dataset&&t.dataset.pf){if(/^(exp|rev|pur|sal|prf)(Year|Mon)$/.test(t.dataset.pf)){ui[t.dataset.pf]=t.value;render();}return;}
  if(t.dataset&&t.dataset.ui){ui[t.dataset.ui]=t.value;render();return;}
  if(t.type==='date'){const b=t.closest('label')&&t.closest('label').querySelector('.dow-tag');if(b)b.textContent=dayName(t.value);}
  if(t.id==='att-day'){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.value)||t.value.slice(0,7)!==ui.month)return;
    ui.attDay=t.value;const p=payrollFor(ui.month,false);if(p)repaintAtt(p);return;
  }
  if(t.id==='pr-mode'||t.id==='pr-pay'){
    if(!levelOK('payroll','f'))return;
    const p=payrollFor(ui.month,true);if(p.closed)return;
    if(t.id==='pr-mode')p.dayOffMode=t.value;else p.payAccountId=t.value;
    save();paintAll(p);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  commEvent(t);
  if(t.closest&&t.closest('#tab-payroll')&&!levelOK('payroll','f'))return;
  if(t.matches&&t.matches('#tab-payroll [data-f]')){
    const tr=t.closest('tr'),p=payrollFor(ui.month,true);
    const r=p.rows.find(x=>x.id===tr.dataset.id);
    if(!r||p.closed)return;
    r[t.dataset.f]=t.value;save();paintRow(tr,p);paintTotals(p);
  }else if(t.matches&&t.matches('#tab-payroll [data-cf]')){
    const p=payrollFor(ui.month,false);if(!p||p.closed)return;
    const r=p.rows.find(x=>x.id===ui.prRow);if(!r)return;
    r[t.dataset.cf]=t.value;save();paintCard(p);
  }else if(t.matches&&t.matches('#tab-payroll [data-hrs]')){
    const p=payrollFor(ui.month,false);if(!p||p.closed)return;
    const r=p.rows.find(x=>x.id===t.closest('.day-row').dataset.id),d=+attDayFor().slice(8);
    if(!r||r.att[d]!=='p')return;
    const v=normDigits(t.value).trim();
    if(v===''||!isFinite(parseNum(v)))delete r.hrs[d];else r.hrs[d]=Math.min(24,nn(v));
    save();
    const box=$('#att-grid-box');if(box){const w=$('.att-wrap',box),sl=w?w.scrollLeft:0;box.innerHTML=attGridHTML(p);const w2=$('.att-wrap',box);if(w2)w2.scrollLeft=sl;}
  }else if(t.matches&&t.matches('#tab-payroll [data-late]')){
    const p=payrollFor(ui.month,false);if(!p||p.closed)return;
    const r=p.rows.find(x=>x.id===t.closest('.day-row').dataset.id),d=+attDayFor().slice(8);
    if(!r||r.att[d]!=='p')return;
    if(!r.late||typeof r.late!=='object')r.late={};
    const v=normDigits(t.value).trim();
    if(v===''||!(parseNum(v)>0))delete r.late[d];else r.late[d]=Math.min(1440,Math.round(parseNum(v)));
    save();
  }else if(t.id==='pr-hpd'){
    const p=payrollFor(ui.month,true);if(p.closed)return;
    p.hoursPerDay=t.value;save();paintAll(p);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').classList.contains('open')){closeModal();return;}
  if(e.key!=='Enter'||!e.target.matches||!e.target.matches('#tab-payroll [data-f]'))return;
  e.preventDefault();
  const all=$$('#tab-payroll [data-f]:not([disabled])');
  const i=all.indexOf(e.target);
  if(i>-1&&i<all.length-1)all[i+1].focus();
  else if(i===all.length-1)e.target.blur();
});

act.importEmps=()=>{
  const seen={};
  Object.keys(state.payroll).sort().forEach(k=>{
    const p=state.payroll[k];
    (p.rows||[]).forEach(r=>{
      if(isAtt(r))return;
      const n=(r.name||'').replace(/\s+/g,' ').trim();if(!n)return;
      const rate=nn(r.rate);
      if(!seen[n])seen[n]={rate:rate,hpd:nn(p.hoursPerDay)||8};
      else if(rate>0)seen[n].rate=rate;
    });
  });
  const since=curMonth();let added=0;
  Object.keys(seen).forEach(n=>{
    if(state.employees.some(e=>e.name===n))return;
    state.employees.push({id:uid(),name:n,job:'',hpd:seen[n].hpd,off:5,active:true,since:since,rates:[{from:since,rate:seen[n].rate,basis:'hour'}],ot:1,absMult:1,lateMult:1,restPaid:false,ins:0,tax:0,payAcc:''});added++;
  });
  ensureMonthRows(ui.month);save();render();toast(added?'تم استيراد '+added+' موظف (راجع سعر الساعة ويوم الراحة)':'لا يوجد جديد للاستيراد');
};
function itemModal(r,it){
  const edit=!!it,m=ui.month,today=todayStr();
  const defDate=today.slice(0,7)===m?today:ymd(m,1);
  openModal({title:edit?'تعديل حركة':'إضافة حركة',
    text:'«'+r.name+'» — شهر '+monthLabel(m)+'. تُخصم السلفة من هذا الشهر وتُقسَّم على الأقساط، وما لم يُسدَّد منها يُرحَّل تلقائيًا إلى الشهر التالي.',
    okLabel:edit?'حفظ':'إضافة',
    fields:[
      {name:'type',label:'نوع الحركة',options:Object.keys(ITEM_TYPES).map(k=>[k,ITEM_TYPES[k]]),value:edit?it.type:'bonus'},
      {name:'date',label:'التاريخ',type:'date',maxlength:10,value:edit&&it.date?it.date:defDate},
      {name:'amount',label:'المبلغ ('+CUR+')',inputmode:'decimal',maxlength:10,value:edit?String(it.amount):''},
      {name:'inst',label:'عدد أقساط السلفة (للسلفة فقط، 1 = تُخصم كاملة)',inputmode:'numeric',maxlength:2,value:edit&&it.inst?String(it.inst):'1'},
      {name:'note',label:'ملاحظة (اختياري)',plain:true,maxlength:60,value:edit?it.note:''}
    ],
    onSubmit:async v=>{
      const p=payrollFor(ui.month,false);if(!p||p.closed)return 'هذا الشهر مقفل';
      const type=ITEM_TYPES[v.type]?v.type:'bonus';
      const date=String(v.date||'');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date.slice(0,7)!==m)return 'يجب أن يكون التاريخ داخل شهر '+monthLabel(m);
      const amount=round2(parseNum(v.amount));
      if(!(amount>0))return 'أدخل مبلغًا صحيحًا أكبر من صفر';
      const note=(v.note||'').replace(/\s+/g,' ').trim().slice(0,60);
      let inst=1;
      if(type==='advance'){
        inst=String(v.inst).trim()===''?1:Math.round(parseNum(v.inst));
        if(!(inst>=1&&inst<=36))return 'عدد الأقساط بين 1 و 36';
      }
      if(!Array.isArray(r.items))r.items=[];
      if(edit){
        const x=r.items.find(i=>i.id===it.id);if(!x)return 'تعذر العثور على الحركة';
        x.type=type;x.date=date;x.amount=amount;x.note=note;
        if(type==='advance')x.inst=inst;else delete x.inst;
      }else{
        if(r.items.length>=200)return 'بلغ الحد الأقصى للحركات في الشهر';
        const x={id:uid(),type:type,date:date,amount:amount,note:note};
        if(type==='advance')x.inst=inst;
        r.items.push(x);
      }
      save();keepScroll(renderPayroll);toast(edit?'تم حفظ الحركة':'تمت إضافة الحركة');return null;
    }});
}
function itemTarget(b){
  const p=payrollFor(ui.month,false);if(!p||p.closed)return null;
  if(b.dataset.act==='addItem'){
    const id=b.dataset.id||ui.prRow,r=p.rows.find(x=>x.id===id&&isAtt(x));
    return r?{r:r,it:null}:null;
  }
  const id=b.dataset.id;
  for(const r of p.rows){const it=(r.items||[]).find(x=>x.id===id);if(it)return {r:r,it:it};}
  return null;
}
act.addItem=b=>{const t=itemTarget(b);if(t)itemModal(t.r,null);};

act.fillCard=()=>{const p=payrollFor(ui.month,false);if(!p||p.closed)return;const r=p.rows.find(x=>x.id===ui.prRow);if(!r)return;fillRow(r);save();keepScroll(renderPayroll);};
